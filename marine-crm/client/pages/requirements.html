<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Requirements Vacancies - Marine CRM</title>
    <link rel="stylesheet" href="/public/css/styles1.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>

<body>
    <div class="app-wrapper">
        <div id="sidebar-container"></div>
        <div id="sidebar-overlay" class="sidebar-overlay"></div>
        <div class="main-content">
            <div id="navbar-container"></div>
            <main class="page-content">
                <div class="page-header">
                    <div>
                        <h1 class="page-title">📋 Open Vacancies & Requirements</h1>
                        <p class="page-subtitle">Match seafarers with open requirements from vessel</p>
                    </div>
                    <button id="add-req-btn" class="btn btn-primary">
                        <i class="fas fa-plus"></i> Add Job Order
                    </button>
                </div>

                <div class="filter-bar">
                    <div class="filter-group">
                        <select id="vessel-filter" class="form-control">
                            <option value="">All Vessel Types</option>
                            <option value="Tanker">Tanker</option>
                            <option value="Bulk Carrier">Bulk Carrier</option>
                            <option value="Container">Container</option>
                            <option value="RoRo">RoRo</option>
                            <option value="Gas Carrier">Gas Carrier</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <select id="status-filter" class="form-control">
                            <option value="">All Vacancies</option>
                            <option value="OPEN">OPEN</option>
                            <option value="FULFILLED">FULFILLED</option>
                            <option value="CANCELLED">CANCELLED</option>
                        </select>
                    </div>
                </div>

                <div class="card">
                    <div class="card-body">
                        <div class="table-container">
                            <table id="requirements-table" class="table">
                                <thead>
                                    <tr>
                                        <th>Vessel</th>
                                        <th>Vessel Type</th>
                                        <th>Rank Needed</th>
                                        <th>Exp Needed</th>
                                        <th>Target Joining</th>
                                        <th>Salary Offered</th>
                                        <th>Status</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="requirements-tbody">
                                    <tr class="skeleton-row">
                                        <td>
                                            <div class="skeleton-box"></div>
                                        </td>
                                        <td>
                                            <div class="skeleton-box"></div>
                                        </td>
                                        <td>
                                            <div class="skeleton-box"></div>
                                        </td>
                                        <td>
                                            <div class="skeleton-box"></div>
                                        </td>
                                        <td>
                                            <div class="skeleton-box"></div>
                                        </td>
                                        <td>
                                            <div class="skeleton-box"></div>
                                        </td>
                                        <td>
                                            <div class="skeleton-box"></div>
                                        </td>
                                        <td>
                                            <div class="skeleton-box"></div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <div id="empty-state" class="empty-state" style="display: none;">
                            <i class="fas fa-clipboard-list fa-3x"></i>
                            <p>No job orders found matching criteria.</p>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/public/js/api/api.js"></script>
    <script src="/public/js/components/ui.js"></script>
    <script src="/public/js/components/sidebar.js"></script>
    <script src="/public/js/components/birthday.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let requirementsData = [];
            let companiesData = [];
            let _reqModal = null;
            let _matchModal = null;

            const tbody = document.getElementById('requirements-tbody');
            const vesselFilter = document.getElementById('vessel-filter');
            const statusFilter = document.getElementById('status-filter');
            const emptyState = document.getElementById('empty-state');

            async function fetchData() {
                try {
                    const [reqRes, compRes] = await Promise.all([
                        window.ApiService.crewing.requirements.getAll(),
                        window.ApiService.companies.getAll()
                    ]);
                    requirementsData = reqRes.data || [];
                    companiesData = compRes.data || [];
                    renderTable();
                } catch (error) {
                    console.error('Error:', error);
                    if (window.UI?.showToast) window.UI.showToast('Failed to load job orders', 'error');
                }
            }

            function renderTable() {
                const vessel = vesselFilter.value;
                const status = statusFilter.value;

                const filtered = requirementsData.filter(r => {
                    const matchVessel = vessel ? r.vesselType === vessel : true;
                    const matchStatus = status ? r.status === status : true;
                    return matchVessel && matchStatus;
                });

                tbody.innerHTML = '';
                if (filtered.length === 0) {
                    emptyState.style.display = 'block';
                    document.getElementById('requirements-table').style.display = 'none';
                } else {
                    emptyState.style.display = 'none';
                    document.getElementById('requirements-table').style.display = 'table';
                    filtered.forEach(r => {
                        const tr = document.createElement('tr');
                        const formatJoin = new Date(r.joiningDate).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
                        const companyName = r.companyId ? r.companyId.name : 'Unknown';

                        tr.innerHTML = `
                            <td><strong>${companyName}</strong></td>
                            <td>${r.vesselType}</td>
                            <td><span class="badge badge-blue">${r.rank}</span></td>
                            <td>${r.experienceMonthsRequired} months</td>
                            <td>${formatJoin}</td>
                            <td><strong style="color: var(--green);">$${r.salaryOffered || 0}/m</strong></td>
                            <td>
                                ${window.UI?.renderStatusBadge ? window.UI.renderStatusBadge(r.status) : `<span class="badge">${r.status}</span>`}
                            </td>
                            <td class="row-actions">
                                <button class="btn btn-primary btn-sm" onclick="matchCandidates('${r.id}')" title="Match Qualified Seafarers"><i class="fas fa-user-check"></i> Match Crew</button>
                                <button class="btn btn-secondary btn-sm" onclick="deleteRequirement('${r.id}')" title="Delete Vacancy"><i class="fas fa-trash"></i></button>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
            }

            vesselFilter.addEventListener('change', renderTable);
            statusFilter.addEventListener('change', renderTable);

            document.getElementById('add-req-btn').addEventListener('click', () => {
                openRequirementModal();
            });

            function openRequirementModal() {
                const companyOptions = companiesData.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
                const rankOptions = [
                    'Master', 'Chief Officer', '2nd Officer', '3rd Officer', 'Junior Officer', 'Bosun', 'AB', 'OS',
                    'Chief Engineer', '2E', '3E', '4E', 'ETO', 'Fitter', 'Oiler', 'Wiper',
                    'Cook', 'Messman'
                ].map(r => `<option value="${r}">${r}</option>`).join('');

                const bodyHtml = `
                    <form id="requirement-form">
                        <div class="form-group">
                            <label class="form-label">Vessel *</label>
                            <select id="req-company" class="form-control" required>
                                <option value="">Select Vessel</option>
                                ${companyOptions}
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Vessel Type *</label>
                            <select id="req-vessel" class="form-control" required>
                                <option value="">Select Vessel Type</option>
                                <option value="Tanker">Tanker</option>
                                <option value="Bulk Carrier">Bulk Carrier</option>
                                <option value="Container">Container</option>
                                <option value="RoRo">RoRo</option>
                                <option value="Gas Carrier">Gas Carrier</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Rank Required *</label>
                            <select id="req-rank" class="form-control" required>
                                <option value="">Select Rank</option>
                                ${rankOptions}
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Required Experience (in Months) *</label>
                            <input type="number" id="req-exp" class="form-control" value="0" placeholder="e.g. 12" required>
                        </div>
                        <div class="form-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                            <div class="form-group">
                                <label class="form-label">Target Joining Date *</label>
                                <input type="date" id="req-joining" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Salary Offered ($/m)</label>
                                <input type="number" id="req-salary" class="form-control">
                            </div>
                        </div>
                    </form>
                `;

                const footerHtml = `
                    <button class="btn btn-secondary" type="button" id="cancel-req-btn">Cancel</button>
                    <button class="btn btn-primary"   type="button" id="save-req-btn">Save Job Order</button>
                `;

                if (window.UI?.createModal) {
                    _reqModal = window.UI.createModal({
                        title: 'Add Job Order Vacancy',
                        bodyHtml,
                        footerHtml,
                        onClose: () => { _reqModal = null; }
                    });

                    _reqModal.querySelector('#cancel-req-btn').addEventListener('click', () => {
                        if (_reqModal) _reqModal.close();
                    });

                    _reqModal.querySelector('#save-req-btn').addEventListener('click', saveRequirement);
                }
            }

            async function saveRequirement() {
                const companyId = document.getElementById('req-company').value;
                const vesselType = document.getElementById('req-vessel').value;
                const rank = document.getElementById('req-rank').value;
                const exp = document.getElementById('req-exp').value;
                const joiningDate = document.getElementById('req-joining').value;
                const salaryOffered = document.getElementById('req-salary').value;

                if (!companyId || !vesselType || !rank || !joiningDate) {
                    if (window.UI?.showToast) window.UI.showToast('Please fill out all required fields', 'error');
                    return;
                }

                const payload = {
                    companyId, vesselType, rank,
                    experienceMonthsRequired: parseInt(exp),
                    joiningDate,
                    salaryOffered: salaryOffered ? parseFloat(salaryOffered) : null
                };

                try {
                    await window.ApiService.crewing.requirements.create(payload);
                    if (window.UI?.showToast) window.UI.showToast('✅ Vacancy created successfully', 'success');
                    if (_reqModal) _reqModal.close();
                    fetchData();
                } catch (error) {
                    console.error('Error saving vacancy:', error);
                    if (window.UI?.showToast) window.UI.showToast('Error creating requirement', 'error');
                }
            }

            // ── Safe formatting helpers ─────────────────────────────────
            // Candidate.availableFrom / expectedSalary are optional fields on
            // the real model — never assume they're populated. Falls back to
            // "N/A" instead of ever rendering "undefined" or "Invalid Date".
            function formatDateSafe(value) {
                if (!value) return 'N/A';
                const d = new Date(value);
                return isNaN(d.getTime()) ? 'N/A' : d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            }

            function formatSalarySafe(amount, currency) {
                if (amount === null || amount === undefined || amount === '') return 'N/A';
                const num = Number(amount);
                if (isNaN(num)) return 'N/A';
                return `${currency || 'USD'} ${num.toLocaleString()}/m`;
            }

            function escapeHtml(value) {
                if (value === null || value === undefined || value === '') return 'N/A';
                return String(value).replace(/[<>&]/g, (c) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]));
            }

            window.matchCandidates = async (id) => {
                try {
                    await refreshMatchModal(id);
                } catch (error) {
                    console.error('Matching Error:', error);
                    if (window.UI?.showToast) window.UI.showToast(error?.message || 'Error finding matched candidates', 'error');
                }
            };

            // Loads matched candidates for the requirement AND the set of
            // candidateIds already PROPOSED for that same requirement (from
            // the existing Applications API), so the modal can correctly
            // show "Already Proposed" instead of letting the same candidate
            // be proposed twice.
            async function loadMatchedCrew(reqId) {
                const [matchedRes, appsRes] = await Promise.all([
                    window.ApiService.crewing.requirements.match(reqId),
                    window.ApiService.crewing.applications
                        .getAll({ requirementId: reqId, status: 'PROPOSED' })
                        .catch(() => ({ data: [] }))
                ]);

                const matchedCrew = matchedRes.data || [];
                const proposedApps = appsRes.data || [];
                const proposedCandidateIds = new Set(
                    proposedApps
                        .map(a => (a.candidateId && (a.candidateId.id || a.candidateId._id)) || a.candidateId)
                        .filter(Boolean)
                        .map(String)
                );

                return { matchedCrew, proposedCandidateIds };
            }

            async function refreshMatchModal(reqId) {
                const { matchedCrew, proposedCandidateIds } = await loadMatchedCrew(reqId);
                renderMatchModal(reqId, matchedCrew, proposedCandidateIds);
            }

            function renderMatchModal(reqId, crewList, proposedCandidateIds) {
                let matchingRowsHtml = '';
                if (crewList.length === 0) {
                    matchingRowsHtml = `
                        <tr>
                            <td colspan="8" style="text-align: center; padding: 20px;">
                                <i class="fas fa-exclamation-triangle fa-2x" style="color: var(--yellow);"></i>
                                <p style="margin-top: 10px;">No candidates currently match this Rank + Vessel Type experience.</p>
                            </td>
                        </tr>
                    `;
                } else {
                    crewList.forEach(c => {
                        const alreadyProposed = proposedCandidateIds.has(String(c.id));
                        const actionHtml = alreadyProposed
                            ? `<button class="btn btn-secondary btn-sm" disabled><i class="fas fa-check"></i> Already Proposed</button>`
                            : `<button class="btn btn-primary btn-sm" data-candidate-id="${c.id}" onclick="proposeCandidate('${reqId}', '${c.id}', this)"><i class="fas fa-paper-plane"></i> Propose</button>`;

                        matchingRowsHtml += `
                            <tr>
                                <td><strong>${escapeHtml(c.name)}</strong></td>
                                <td>${escapeHtml(c.rank)}</td>
                                <td>${escapeHtml(c.nationality)}</td>
                                <td>${c.experienceYears !== undefined && c.experienceYears !== null ? c.experienceYears + ' yrs' : 'N/A'}</td>
                                <td><strong style="color: var(--accent-primary);">${formatSalarySafe(c.expectedSalary, c.currency)}</strong></td>
                                <td>${formatDateSafe(c.availableFrom)}</td>
                                <td>${escapeHtml(c.currentVessel)}</td>
                                <td>${actionHtml}</td>
                            </tr>
                        `;
                    });
                }

                const bodyHtml = `
                    <div class="table-container" style="max-height: 50vh; overflow-y: auto;">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Crew Name</th>
                                    <th>Rank</th>
                                    <th>Nationality</th>
                                    <th>Experience</th>
                                    <th>Expected Salary</th>
                                    <th>Available From</th>
                                    <th>Current Vessel</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${matchingRowsHtml}
                            </tbody>
                        </table>
                    </div>
                `;

                if (_matchModal) {
                    // Modal already open for this requirement — refresh its
                    // body in place instead of closing/reopening.
                    const bodyEl = _matchModal.querySelector('.modal-body');
                    if (bodyEl) bodyEl.innerHTML = bodyHtml;
                } else if (window.UI?.createModal) {
                    _matchModal = window.UI.createModal({
                        title: 'Auto-Matched Qualified Seafarers',
                        bodyHtml,
                        footerHtml: `<button class="btn btn-secondary" onclick="closeMatchModal()">Close</button>`,
                        onClose: () => { _matchModal = null; }
                    });
                }
            }

            window.closeMatchModal = () => {
                if (_matchModal) _matchModal.close();
            };

            window.proposeCandidate = async (reqId, candidateId, btnEl) => {
                // Disable immediately to prevent a duplicate submission from a
                // fast double-click while the request is in flight.
                if (btnEl) {
                    btnEl.disabled = true;
                    btnEl.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Proposing...';
                }
                try {
                    const res = await window.ApiService.crewing.applications.propose({ requirementId: reqId, candidateId });
                    if (window.UI?.showToast) window.UI.showToast('✅ ' + (res?.message || 'Candidate successfully proposed.'), 'success');
                    // Refresh matching candidates so the proposed candidate no
                    // longer shows as freshly AVAILABLE / can't be proposed again.
                    await refreshMatchModal(reqId);
                } catch (error) {
                    console.error('Propose error:', error);
                    if (window.UI?.showToast) window.UI.showToast(error?.message || 'Error proposing candidate', 'error');
                    if (btnEl) {
                        btnEl.disabled = false;
                        btnEl.innerHTML = '<i class="fas fa-paper-plane"></i> Propose';
                    }
                }
            };

            window.deleteRequirement = async (id) => {
                if (window.UI?.confirm) {
                    const confirmed = await window.UI.confirm('Are you sure you want to delete this requirement?');
                    if (confirmed) {
                        try {
                            await window.ApiService.crewing.requirements.delete(id);
                            window.UI.showToast('Vacancy deleted', 'success');
                            fetchData();
                        } catch (err) {
                            window.UI.showToast('Error deleting requirement', 'error');
                        }
                    }
                }
            };

            fetchData();
        });
    </script>
    <script src="/public/js/components/ocean-bg.js"></script>
    <script src="/public/js/components/cursor.js"></script>
</body>

</html>
