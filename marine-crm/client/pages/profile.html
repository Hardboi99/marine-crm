<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Profile — Marine CRM</title>
  <link rel="stylesheet" href="/public/css/styles1.css" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
  <style>
    .hidden { display: none !important; }

    /* Full-width responsive profile grid container */
    .profile-dashboard-grid {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 24px;
      align-items: start;
      width: 100%;
    }

    /* Left side: Avatar & user summary card */
    .profile-summary-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 32px 20px;
    }

    .profile-avatar-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      width: 100%;
    }

    .profile-avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--accent-primary);
      box-shadow: var(--accent-glow);
    }

    .profile-avatar-initials {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: var(--accent-primary);
      color: #fff;
      font-size: 2.5rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px solid var(--accent-primary);
      box-shadow: var(--accent-glow);
    }

    .profile-name {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--text-primary);
      margin-top: 8px;
    }

    .profile-role-badge {
      display: inline-block;
      margin-top: 4px;
      padding: 4px 12px;
      background: var(--accent-light);
      color: var(--accent-aqua);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Right side: Information display & edit tabs */
    .profile-details-card {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .profile-info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      padding: 24px;
    }

    .profile-field-box {
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: var(--transition);
    }

    .profile-field-box:hover {
      border-color: var(--border-focus);
      background: var(--bg-subtle);
    }

    .profile-field-label {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .profile-field-value {
      font-size: 0.95rem;
      color: var(--text-primary);
      font-weight: 600;
      word-break: break-word;
    }

    /* Edit Section */
    .profile-edit-body {
      padding: 24px;
      border-top: 1px solid var(--border-color);
    }

    .edit-form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    /* Responsive Breakpoints */
    @media (max-width: 1024px) {
      .profile-dashboard-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 768px) {
      .edit-form-grid {
        grid-template-columns: 1fr;
      }
      .profile-info-grid {
        grid-template-columns: 1fr;
        padding: 16px;
      }
      .profile-edit-body {
        padding: 16px;
      }
    }
  </style>
</head>
<body>
  <!-- Ambient background element for design system -->
  <div id="ocean-bg"></div>

  <div class="app-wrapper">
    <div id="sidebar-container"></div>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <div class="main-content">
      <div id="navbar-container"></div>
      
      <main class="page-content">
        <div class="page-header">
          <div class="page-title-group">
            <h1 class="page-title">My Profile</h1>
            <p class="page-subtitle">View and manage your account details</p>
          </div>
        </div>

        <div class="profile-dashboard-grid">
          <!-- Left Column: Avatar & Quick Actions -->
          <div class="card profile-summary-card" data-reveal>
            <div class="profile-avatar-wrap">
              <div id="avatar-display"></div>
              
              <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:center; margin-top:8px;">
                <button class="btn btn-secondary btn-sm" id="change-photo-btn" type="button">
                  <i class="fas fa-camera"></i> Change
                </button>
                <button class="btn btn-danger btn-sm" id="remove-photo-btn" type="button" style="display:none;">
                  <i class="fas fa-trash"></i> Remove
                </button>
              </div>
              <input type="file" id="avatar-file-input" accept="image/png,image/jpeg,image/webp" class="hidden" />
              
              <div class="profile-name" id="profile-name-display">—</div>
              <div class="profile-role-badge" id="profile-role-display">—</div>
            </div>
          </div>

          <!-- Right Column: Personal Data & Edit Form -->
          <div class="card profile-details-card" data-reveal>
            <div class="card-header">
              <h3 class="card-title"><i class="fas fa-id-card-alt" style="color:var(--accent-aqua); margin-right:8px;"></i> Employee Information</h3>
            </div>

            <!-- Read-only Summary Cards -->
            <div class="profile-info-grid">
              <div class="profile-field-box">
                <span class="profile-field-label">Email Address</span>
                <span class="profile-field-value" id="pf-email">—</span>
              </div>
              <div class="profile-field-box">
                <span class="profile-field-label">Phone Number</span>
                <span class="profile-field-value" id="pf-phone">—</span>
              </div>
              <div class="profile-field-box">
                <span class="profile-field-label">Department</span>
                <span class="profile-field-value" id="pf-dept">—</span>
              </div>
              <div class="profile-field-box">
                <span class="profile-field-label">Employee ID</span>
                <span class="profile-field-value" id="pf-empid">—</span>
              </div>
              <div class="profile-field-box">
                <span class="profile-field-label">Designation</span>
                <span class="profile-field-value" id="pf-position">—</span>
              </div>
              <div class="profile-field-box">
                <span class="profile-field-label">Joining Date</span>
                <span class="profile-field-value" id="pf-joindate">—</span>
              </div>
              <div class="profile-field-box">
                <span class="profile-field-label">Gender</span>
                <span class="profile-field-value" id="pf-gender">—</span>
              </div>
              <div class="profile-field-box">
                <span class="profile-field-label">Blood Group</span>
                <span class="profile-field-value" id="pf-bloodgroup">—</span>
              </div>
              <div class="profile-field-box" style="grid-column: 1 / -1;">
                <span class="profile-field-label">Address</span>
                <span class="profile-field-value" id="pf-address">—</span>
              </div>
            </div>

            <!-- Edit Form Fields -->
            <div class="profile-edit-body">
              <h3 class="card-title" style="margin-bottom:16px;">Update Profile</h3>
              
              <div class="edit-form-grid">
                <div class="form-group">
                  <label class="form-label">Full Name</label>
                  <input id="edit-name" class="form-control" type="text" placeholder="Your full name" />
                </div>
                <div class="form-group">
                  <label class="form-label">Phone Number</label>
                  <input id="edit-phone" class="form-control" type="tel" placeholder="+91 XXXXX XXXXX" />
                </div>
                <div class="form-group">
                  <label class="form-label">Department</label>
                  <input id="edit-dept" class="form-control" type="text" placeholder="Department" />
                </div>
                <div class="form-group">
                  <label class="form-label">Address</label>
                  <input id="edit-address" class="form-control" type="text" placeholder="Street address" />
                </div>
                <div class="form-group">
                  <label class="form-label">Gender</label>
                  <select id="edit-gender" class="form-control">
                    <option value="">Select Gender</option>
                    <option value="MALE">Male</option>
                    <option value="FEMALE">Female</option>
                    <option value="OTHER">Other</option>
                  </select>
                </div>
                <div class="form-group">
                  <label class="form-label">Blood Group</label>
                  <select id="edit-bloodgroup" class="form-control">
                    <option value="">Select Blood Group</option>
                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                  </select>
                </div>
              </div>

              <div style="display:flex; justify-content:flex-end; margin-top:12px;">
                <button class="btn btn-primary" id="save-profile-btn">
                  <i class="fas fa-save"></i> Save Changes
                </button>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="/public/js/api/api.js"></script>
  <script src="/public/js/components/ui.js"></script>
  <script src="/public/js/components/sidebar.js"></script>
  <script>
    const token = localStorage.getItem('token');
    if (!token) { window.location.href = '/pages/login.html'; }

    function initials(name) {
      if (!name) return 'U';
      return name.split(' ').map(n => n[0]).join('').slice(0, 2).toUpperCase();
    }

    function fmtDate(iso) {
      if (!iso) return '—';
      return new Date(iso).toLocaleDateString(undefined, { day: '2-digit', month: 'short', year: 'numeric' });
    }

    function renderAvatar(user) {
      const el = document.getElementById('avatar-display');
      if (user.avatarUrl) {
        el.innerHTML = `<img class="profile-avatar" src="${user.avatarUrl}" alt="Profile photo" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';" /><div class="profile-avatar-initials" style="display:none;">${initials(user.name)}</div>`;
      } else {
        el.innerHTML = `<div class="profile-avatar-initials">${initials(user.name)}</div>`;
      }
      const removeBtn = document.getElementById('remove-photo-btn');
      if (removeBtn) removeBtn.style.display = user.avatarUrl ? '' : 'none';
    }

    function persistUserLocally(patch) {
      const stored = JSON.parse(localStorage.getItem('user') || '{}');
      const updated = { ...stored, ...patch };
      localStorage.setItem('user', JSON.stringify(updated));
      return updated;
    }

    async function loadProfile() {
      try {
        const [userRes, empRes] = await Promise.all([
          window.ApiService.getMe(),
          window.ApiService.employees.getMyProfile().catch(() => ({ data: null })),
        ]);
        const user = userRes.data || userRes;
        const emp = (empRes && empRes.data) || null;

        renderAvatar(user);
        document.getElementById('profile-name-display').textContent = user.name || '—';
        document.getElementById('profile-role-display').textContent = user.role || '—';
        document.getElementById('pf-email').textContent = user.email || '—';
        document.getElementById('pf-phone').textContent = user.phone || '—';
        document.getElementById('pf-dept').textContent = user.department || '—';

        if (emp) {
          document.getElementById('pf-empid').textContent = emp.employeeId || '—';
          document.getElementById('pf-position').textContent = emp.position || '—';
          document.getElementById('pf-joindate').textContent = fmtDate(emp.joinDate);
          document.getElementById('pf-address').textContent = emp.address || '—';
          document.getElementById('pf-gender').textContent = emp.gender ? (emp.gender.charAt(0) + emp.gender.slice(1).toLowerCase()) : '—';
          document.getElementById('pf-bloodgroup').textContent = emp.bloodGroup || '—';
        }

        // Fill update form
        document.getElementById('edit-name').value = user.name || '';
        document.getElementById('edit-phone').value = user.phone || '';
        document.getElementById('edit-dept').value = user.department || '';
        document.getElementById('edit-address').value = (emp && emp.address) || '';
        document.getElementById('edit-gender').value = (emp && emp.gender) || '';
        document.getElementById('edit-bloodgroup').value = (emp && emp.bloodGroup) || '';

      } catch (err) {
        if (window.UI) UI.showToast('Could not load profile.', 'error');
      }
    }

    document.getElementById('save-profile-btn').addEventListener('click', async () => {
      const btn = document.getElementById('save-profile-btn');
      btn.disabled = true;
      try {
        const userPayload = {
          name: document.getElementById('edit-name').value.trim(),
          phone: document.getElementById('edit-phone').value.trim(),
          department: document.getElementById('edit-dept').value.trim(),
        };
        const empPayload = {
          address: document.getElementById('edit-address').value.trim(),
          gender: document.getElementById('edit-gender').value || null,
          bloodGroup: document.getElementById('edit-bloodgroup').value || null,
        };

        await Promise.all([
          window.ApiService.updateMe(userPayload),
          window.ApiService.employees.updateMyProfile(empPayload).catch(() => null),
        ]);

        persistUserLocally(userPayload);
        if (window.UI) UI.showToast('Profile updated successfully.', 'success');
        await loadProfile();
      } catch (err) {
        if (window.UI) UI.showToast((err && err.message) || 'Could not save profile.', 'error');
      } finally {
        btn.disabled = false;
      }
    });

    document.getElementById('change-photo-btn').addEventListener('click', () => {
      document.getElementById('avatar-file-input').click();
    });

    document.getElementById('avatar-file-input').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const changeBtn = document.getElementById('change-photo-btn');
      changeBtn.disabled = true;
      try {
        const res = await window.ApiService.uploadAvatar(file);
        const updatedUser = res.data || res;
        persistUserLocally({ avatarUrl: updatedUser.avatarUrl });
        renderAvatar(updatedUser);
        if (window.UI) UI.showToast('Profile photo updated.', 'success');
      } catch (err) {
        if (window.UI) UI.showToast((err && err.message) || 'Could not upload photo.', 'error');
      } finally {
        changeBtn.disabled = false;
        e.target.value = '';
      }
    });

    document.getElementById('remove-photo-btn').addEventListener('click', async () => {
      const removeBtn = document.getElementById('remove-photo-btn');
      removeBtn.disabled = true;
      try {
        const res = await window.ApiService.removeAvatar();
        const updatedUser = res.data || res;
        persistUserLocally({ avatarUrl: null });
        renderAvatar(updatedUser);
        if (window.UI) UI.showToast('Profile photo removed.', 'success');
      } catch (err) {
        if (window.UI) UI.showToast((err && err.message) || 'Could not remove photo.', 'error');
      } finally {
        removeBtn.disabled = false;
      }
    });

    loadProfile();
  </script>
  <script src="/public/js/components/cursor.js"></script>
</body>
</html>
