    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/public/js/api/api.js"></script>
    <script src="/public/js/components/ui.js"></script>
    <script src="/public/js/components/sidebar.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (!localStorage.getItem('token')) {
                window.location.href = '/pages/login.html';
                return;
            }

            let companiesData = [];
            let countriesData = [];
            let currentEditId = null;
            let _companyModal = null;

            const tbody = document.getElementById('companies-tbody');
            const searchInput = document.getElementById('search-input');
            const statusFilter = document.getElementById('status-filter');
            const countryFilter = document.getElementById('country-filter');
            const emptyState = document.getElementById('empty-state');

            async function fetchData() {
                try {
                    const [compRes, countRes] = await Promise.all([
                        window.ApiService.companies.getAll(),
                        window.ApiService.countries.getAll()
                    ]);
                    companiesData = compRes.data || [];
                    countriesData = countRes.data || [];
                    populateCountryFilter();
                    renderTable();
                } catch (error) {
                    console.error('Error fetching data:', error);
                    if (window.UI && window.UI.showToast) {
                        window.UI.showToast('Failed to load data', 'error');
                    }
                }
            }

            function populateCountryFilter() {
                countryFilter.innerHTML = '<option value="">All Countries</option>';
                countriesData.forEach(c => {
                    const option = document.createElement('option');
                    option.value = c.id;
                    option.textContent = c.name;
                    countryFilter.appendChild(option);
                });
            }

            function renderTable() {
                const search = searchInput.value.toLowerCase();
                const status = statusFilter.value;
                const countryId = countryFilter.value;

                const filtered = companiesData.filter(c => {
                    // API returns camelCase: contactPerson, countryId
                    const matchSearch = c.name.toLowerCase().includes(search) || (c.contactPerson && c.contactPerson.toLowerCase().includes(search));
                    const matchStatus = status ? c.status === status : true;
                    const matchCountry = countryId ? (c.countryId === countryId || (c.country && c.country.id === countryId)) : true;
                    return matchSearch && matchStatus && matchCountry;
                });

                tbody.innerHTML = '';
                if (filtered.length === 0) {
                    emptyState.style.display = 'block';
                    document.getElementById('companies-table').style.display = 'none';
                } else {
                    emptyState.style.display = 'none';
                    document.getElementById('companies-table').style.display = 'table';
                    filtered.forEach(company => {
                        // country is included as nested object from API
                        const countryName = company.country ? company.country.name : 'Unknown';
                        const callsCount = company._count ? company._count.calls : 0;

                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td><strong>${company.name}</strong></td>
                            <td>${countryName}</td>
                            <td>${company.contactPerson || '-'}</td>
                            <td>
                                ${window.UI && window.UI.renderStatusBadge ? window.UI.renderStatusBadge(company.status) : `<span class="badge badge-gray">${company.status}</span>`}
                            </td>
                            <td>${company.status || '-'}</td>
                            <td>${callsCount}</td>
                            <td class="row-actions">
                                <button class="btn btn-secondary btn-sm" onclick="editCompany('${company.id}')"><i class="fas fa-edit"></i></button>
                                <button class="btn btn-danger btn-sm" onclick="deleteCompany('${company.id}')"><i class="fas fa-trash"></i></button>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
            }

            searchInput.addEventListener('input', renderTable);
            statusFilter.addEventListener('change', renderTable);
            countryFilter.addEventListener('change', renderTable);

            document.getElementById('add-company-btn').addEventListener('click', () => {
                currentEditId = null;
                openCompanyModal();
            });

            window.editCompany = (id) => {
                currentEditId = id;
                const company = companiesData.find(c => c.id === id);
                if (company) openCompanyModal(company);
            }

            function openCompanyModal(company = null) {
                const title = company ? 'Edit Vessel Owner' : 'Add Vessel Owner';
                // Use camelCase countryId from API
                const compCountryId = company ? (company.countryId || (company.country && company.country.id)) : null;
                const countryOptions = countriesData.map(c => `<option value="${c.id}" ${compCountryId === c.id ? 'selected' : ''}>${c.name}</option>`).join('');

                const bodyHtml = `
                    <form id="company-form">
                        <div class="form-group">
                            <label class="form-label">Company Name *</label>
                            <input type="text" id="comp-name" class="form-control" value="${company ? company.name : ''}" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Country *</label>
                            <select id="comp-country" class="form-control" required>
                                <option value="">Select a country</option>
                                ${countryOptions}
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Contact Person</label>
                            <input type="text" id="comp-contact" class="form-control" value="${company ? (company.contactPerson || '') : ''}">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Email</label>
                            <input type="email" id="comp-email" class="form-control" value="${company ? (company.email || '') : ''}">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Phone</label>
                            <input type="text" id="comp-phone" class="form-control" value="${company ? (company.phone || '') : ''}">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Website</label>
                            <input type="url" id="comp-website" class="form-control" value="${company ? (company.website || '') : ''}">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Fleet Details</label>
                            <textarea id="comp-fleet" class="form-control">${company ? (company.fleetDetails || '') : ''}</textarea>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Status</label>
                            <select id="comp-status" class="form-control">
                                <option value="PROSPECT" ${company && company.status === 'PROSPECT' ? 'selected' : ''}>PROSPECT</option>
                                <option value="NEGOTIATING" ${company && company.status === 'NEGOTIATING' ? 'selected' : ''}>NEGOTIATING</option>
                                <option value="CLIENT" ${company && company.status === 'CLIENT' ? 'selected' : ''}>CLIENT</option>
                                <option value="REJECTED" ${company && company.status === 'REJECTED' ? 'selected' : ''}>REJECTED</option>
                            </select>
                        </div>
                    </form>
                `;

                const footerHtml = `
                    <button class="btn btn-secondary" type="button" id="cancel-company-btn">Cancel</button>
                    <button class="btn btn-primary"   type="button" id="save-company-btn">Save</button>
                `;

                if (window.UI && window.UI.createModal) {
                    _companyModal = window.UI.createModal({
                        title,
                        bodyHtml,
                        footerHtml,
                        onClose: () => { _companyModal = null; }
                    });
                    // Wire buttons after modal is in DOM
                    _companyModal.querySelector('#cancel-company-btn').addEventListener('click', () => {
                        if (_companyModal) _companyModal.close();
                    });
                    _companyModal.querySelector('#save-company-btn').addEventListener('click', saveCompany);
                }
            }

            window.closeModal = () => {
                if (_companyModal && _companyModal.close) {
                    _companyModal.close();
                } else {
                    const modal = document.querySelector('.modal-overlay');
                    if (modal) HTMLElement.prototype.remove.call(modal);
                }
            };

            window.saveCompany = async () => {
                const name = document.getElementById('comp-name').value.trim();
                const countryId = document.getElementById('comp-country').value;

                if (!name || !countryId) {
                    if (window.UI && window.UI.showToast) window.UI.showToast('Name and Country are required', 'error');
                    return;
                }

                // Use camelCase keys to match the Mongoose/API schema
                const payload = {
                    name,
                    countryId,
                    contactPerson: document.getElementById('comp-contact').value.trim(),
                    email: document.getElementById('comp-email').value.trim(),
                    phone: document.getElementById('comp-phone').value.trim(),
                    website: document.getElementById('comp-website').value.trim(),
                    fleetDetails: document.getElementById('comp-fleet').value.trim(),
                    status: document.getElementById('comp-status').value
                };

                try {
                    if (currentEditId) {
                        await window.ApiService.companies.update(currentEditId, payload);
                        if (window.UI && window.UI.showToast) window.UI.showToast('✅ Company updated successfully', 'success');
                    } else {
                        await window.ApiService.companies.create(payload);
                        if (window.UI && window.UI.showToast) window.UI.showToast('✅ Company created successfully', 'success');
                    }
                    if (_companyModal) _companyModal.close();
                    fetchData();
                } catch (error) {
                    console.error('Error saving company:', error);
                    if (window.UI && window.UI.showToast) window.UI.showToast('❌ Error saving company', 'error');
                }
            }

            window.deleteCompany = async (id) => {
                const proceed = async () => {
                    try {
                        await window.ApiService.companies.delete(id);
                        if (window.UI && window.UI.showToast) window.UI.showToast('Company deleted', 'success');
                        fetchData();
                    } catch (err) {
                        console.error('Delete err', err);
                        if (window.UI && window.UI.showToast) window.UI.showToast('Error deleting company', 'error');
                    }
                };

                if (window.UI && window.UI.confirm) {
                    const confirmed = await window.UI.confirm('Are you sure you want to delete this company?');
                    if (confirmed) proceed();
                } else if (confirm('Are you sure you want to delete this company?')) {
                    proceed();
                }
            }

            fetchData();
        });
    </script>
