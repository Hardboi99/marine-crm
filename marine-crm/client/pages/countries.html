<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Country Management - Marine CRM</title>
    <link rel="stylesheet" href="/public/css/styles1.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>

<body>
    <div class="app-wrapper">
        <div id="sidebar-container"></div>
        <div id="sidebar-overlay" class="sidebar-overlay"></div>
        <div class="main-content">
            <div id="navbar-container"></div>
            <main class="page-content">
                <div class="page-header">
                    <div>
                        <h1 class="page-title">🌐 Country Management</h1>
                        <p class="page-subtitle">Manage target countries for vessel owner acquisition</p>
                    </div>
                    <button id="add-country-btn" class="btn btn-primary">
                        <i class="fas fa-plus"></i> Add Country
                    </button>
                </div>

                <div class="card">
                    <div class="card-body">
                        <div class="table-container">
                            <table id="countries-table" class="table">
                                <thead>
                                    <tr>
                                        <th>Country Name</th>
                                        <th>ISO Code</th>
                                        <th>Companies</th>
                                        <th>Status</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="countries-tbody">
                                    <!-- Skeleton loader initially -->
                                    <tr class="skeleton-row">
                                        <td>
                                            <div class="skeleton-box"></div>
                                        </td>
                                        <td>
                                            <div class="skeleton-box"></div>
                                        </td>
                                        <td>
                                            <div class="skeleton-box"></div>
                                        </td>
                                        <td>
                                            <div class="skeleton-box"></div>
                                        </td>
                                        <td>
                                            <div class="skeleton-box"></div>
                                        </td>
                                    </tr>
                                    <tr class="skeleton-row">
                                        <td>
                                            <div class="skeleton-box"></div>
                                        </td>
                                        <td>
                                            <div class="skeleton-box"></div>
                                        </td>
                                        <td>
                                            <div class="skeleton-box"></div>
                                        </td>
                                        <td>
                                            <div class="skeleton-box"></div>
                                        </td>
                                        <td>
                                            <div class="skeleton-box"></div>
                                        </td>
                                    </tr>
                                    <tr class="skeleton-row">
                                        <td>
                                            <div class="skeleton-box"></div>
                                        </td>
                                        <td>
                                            <div class="skeleton-box"></div>
                                        </td>
                                        <td>
                                            <div class="skeleton-box"></div>
                                        </td>
                                        <td>
                                            <div class="skeleton-box"></div>
                                        </td>
                                        <td>
                                            <div class="skeleton-box"></div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <div id="empty-state" class="empty-state" style="display: none;">
                            <i class="fas fa-globe fa-3x"></i>
                            <p>No countries found.</p>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/public/js/api/api.js"></script>
    <script src="/public/js/components/ui.js"></script>
    <script src="/public/js/components/sidebar.js"></script>
    <script src="/public/js/components/birthday.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (!localStorage.getItem('token')) {
                window.location.href = '/pages/login.html';
                return;
            }

            let countriesData = [];
            let companiesData = [];
            let currentEditId = null;

            const tbody = document.getElementById('countries-tbody');
            const emptyState = document.getElementById('empty-state');

            async function fetchData() {
                try {
                    const [countRes, compRes] = await Promise.all([
                        window.ApiService.countries.getAll(),
                        window.ApiService.companies.getAll()
                    ]);
                    countriesData = countRes.data || [];
                    companiesData = compRes.data || [];
                    renderTable();
                } catch (error) {
                    console.error('Error fetching data:', error);
                    if (window.UI && window.UI.showToast) {
                        window.UI.showToast('Failed to load data', 'error');
                    }
                }
            }

            function renderTable() {
                tbody.innerHTML = '';
                if (countriesData.length === 0) {
                    emptyState.style.display = 'block';
                    document.getElementById('countries-table').style.display = 'none';
                } else {
                    emptyState.style.display = 'none';
                    document.getElementById('countries-table').style.display = 'table';
                    countriesData.forEach(country => {
                        // API returns camelCase: code, isActive, _count.companies
                        const compCount = country._count ? country._count.companies : 0;
                        const statusBadge = country.isActive !== false
                            ? '<span class="badge badge-green">Active</span>'
                            : '<span class="badge badge-gray">Inactive</span>';

                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td><strong>${country.name}</strong></td>
                            <td>${country.code || '-'}</td>
                            <td>${compCount}</td>
                            <td>${statusBadge}</td>
                            <td class="row-actions">
                                <button class="btn btn-secondary btn-sm" onclick="editCountry('${country.id}')"><i class="fas fa-edit"></i></button>
                                <button class="btn btn-danger btn-sm" onclick="deleteCountry('${country.id}')"><i class="fas fa-trash"></i></button>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
            }

            // Add Country
            document.getElementById('add-country-btn').addEventListener('click', () => {
                currentEditId = null;
                openCountryModal();
            });

            window.editCountry = (id) => {
                currentEditId = id;
                const country = countriesData.find(c => c.id === id);
                if (country) openCountryModal(country);
            }

            function openCountryModal(country = null) {
                const title = country ? 'Edit Country' : 'Add Country';
                // API returns camelCase: code, isActive
                const isActive = country ? country.isActive !== false : true;

                const bodyHtml = `
                    <form id="country-form">
                        <div class="form-group">
                            <label class="form-label">Country Name *</label>
                            <input type="text" id="country-name" class="form-control" value="${country ? country.name : ''}" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">ISO Code (e.g. AE) *</label>
                            <input type="text" id="country-iso" class="form-control" value="${country ? (country.code || '') : ''}" required maxlength="5">
                        </div>
                        <div class="form-group" style="display: flex; align-items: center; gap: 10px;">
                            <input type="checkbox" id="country-active" ${isActive ? 'checked' : ''}>
                            <label class="form-label" style="margin: 0;">Active</label>
                        </div>
                    </form>
                `;

                const footerHtml = `
                    <button class="btn btn-secondary" type="button" id="cancel-country-btn">Cancel</button>
                    <button class="btn btn-primary"   type="button" id="save-country-btn">Save</button>
                `;

                if (window.UI && window.UI.createModal) {
                    window.currentModal = window.UI.createModal({
                        title, bodyHtml, footerHtml,
                        onClose: () => { window.currentModal = null; }
                    });
                    window.currentModal.querySelector('#cancel-country-btn').addEventListener('click', () => {
                        if (window.currentModal) window.currentModal.close();
                    });
                    window.currentModal.querySelector('#save-country-btn').addEventListener('click', window.saveCountry);
                }
            }

            window.closeModal = () => {
                if (window.currentModal && window.currentModal.close) {
                    window.currentModal.close();
                } else {
                    const modal = document.querySelector('.modal-overlay');
                    if (modal) HTMLElement.prototype.remove.call(modal);
                }
            };

            window.saveCountry = async () => {
                const name = document.getElementById('country-name').value.trim();
                // Send 'code' and 'isActive' — matching what the server's createCountry/updateCountry expects
                const code = document.getElementById('country-iso').value.trim().toUpperCase();
                const isActive = document.getElementById('country-active').checked;

                if (!name || !code) {
                    if (window.UI && window.UI.showToast) window.UI.showToast('Name and ISO Code are required', 'error');
                    return;
                }

                const payload = { name, code, isActive };

                try {
                    if (currentEditId) {
                        await window.ApiService.countries.update(currentEditId, payload);
                        if (window.UI && window.UI.showToast) window.UI.showToast('Country updated successfully', 'success');
                    } else {
                        await window.ApiService.countries.create(payload);
                        if (window.UI && window.UI.showToast) window.UI.showToast('Country created successfully', 'success');
                    }
                    closeModal();
                    fetchData();
                } catch (error) {
                    console.error('Error saving country:', error);
                    if (window.UI && window.UI.showToast) window.UI.showToast('Error saving country', 'error');
                }
            }

            window.deleteCountry = async (id) => {
                const proceed = async () => {
                    try {
                        await window.ApiService.countries.delete(id);
                        if (window.UI && window.UI.showToast) window.UI.showToast('Country deleted', 'success');
                        fetchData();
                    } catch (err) {
                        console.error('Delete err', err);
                        if (window.UI && window.UI.showToast) window.UI.showToast('Error deleting country', 'error');
                    }
                };

                if (window.UI && window.UI.confirm) {
                    const confirmed = await window.UI.confirm('Are you sure you want to delete this country?');
                    if (confirmed) proceed();
                } else if (confirm('Are you sure you want to delete this country?')) {
                    proceed();
                }
            }

            fetchData();
        });
    </script>
    <script src="/public/js/components/ocean-bg.js"></script>
    <script src="/public/js/components/cursor.js"></script>
</body>

</html>
