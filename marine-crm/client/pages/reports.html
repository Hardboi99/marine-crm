<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports &amp; Analytics - Marine CRM</title>
  <meta name="description" content="Management-level reports and analytics for Crewing &amp; Recruitment and Front Desk operations.">
  <script>
    (function(){ var t=localStorage.getItem('theme')||'dark'; if(t==='light') document.documentElement.setAttribute('data-theme','light'); })();
  </script>
  <link rel="stylesheet" href="/public/css/styles1.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    .reports-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:28px;}
    .reports-header h1{font-size:1.75rem;font-weight:700;color:var(--text-primary);margin:0;}
    .reports-header .sub{font-size:.82rem;color:var(--text-secondary);margin-top:2px;}
    .rpt-tabs{display:flex;gap:6px;background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:12px;padding:6px;margin-bottom:24px;width:max-content;}
    .rpt-tab{padding:9px 22px;border-radius:8px;font-size:.88rem;font-weight:600;cursor:pointer;transition:.2s;color:var(--text-secondary);border:none;background:transparent;}
    .rpt-tab.active{background:var(--accent-primary);color:#fff;box-shadow:0 2px 12px rgba(0,188,188,.35);}
    .rpt-tab:hover:not(.active){background:var(--hover-bg);}
    .filter-bar{display:flex;align-items:center;flex-wrap:wrap;gap:10px;background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:12px;padding:14px 18px;margin-bottom:24px;}
    .filter-bar label{font-size:.77rem;color:var(--text-secondary);margin-right:4px;}
    .filter-bar input,.filter-bar select{background:var(--card-bg);border:1px solid var(--glass-border);color:var(--text-primary);border-radius:7px;padding:6px 10px;font-size:.82rem;outline:none;transition:.2s;}
    .filter-bar input:focus,.filter-bar select:focus{border-color:var(--accent-primary);}
    .filter-apply{background:var(--accent-primary);color:#fff;border:none;border-radius:7px;padding:7px 18px;font-size:.82rem;font-weight:600;cursor:pointer;transition:.2s;}
    .filter-apply:hover{opacity:.88;}
    .filter-reset{background:transparent;border:1px solid var(--glass-border);color:var(--text-secondary);border-radius:7px;padding:7px 14px;font-size:.82rem;cursor:pointer;transition:.2s;}
    .filter-reset:hover{border-color:var(--accent-primary);color:var(--accent-primary);}
    .kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px;margin-bottom:28px;}
    .kpi-card{background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:14px;padding:18px 20px;transition:.25s;position:relative;overflow:hidden;}
    .kpi-card:hover{transform:translateY(-3px);box-shadow:0 8px 28px rgba(0,0,0,.25);}
    .kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--kpi-accent,var(--accent-primary));}
    .kpi-icon{font-size:1.5rem;margin-bottom:8px;}
    .kpi-value{font-size:2rem;font-weight:800;color:var(--text-primary);line-height:1;}
    .kpi-label{font-size:.74rem;color:var(--text-secondary);margin-top:6px;text-transform:uppercase;letter-spacing:.04em;}
    .kpi-sub{font-size:.72rem;color:var(--accent-primary);margin-top:4px;font-weight:600;}
    .charts-row{display:grid;gap:20px;margin-bottom:24px;}
    .charts-row.two{grid-template-columns:1fr 1fr;}
    .charts-row.three{grid-template-columns:1fr 1fr 1fr;}
    @media(max-width:900px){.charts-row.two,.charts-row.three{grid-template-columns:1fr;}}
    .chart-panel{background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:14px;padding:22px;}
    .chart-panel h3{font-size:.93rem;font-weight:700;color:var(--text-primary);margin:0 0 16px;}
    .chart-panel .chart-sub{font-size:.75rem;color:var(--text-secondary);margin-bottom:12px;margin-top:-10px;}
    .chart-wrap{position:relative;height:220px;}
    .chart-wrap.tall{height:280px;}
    .table-panel{background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:14px;padding:20px;margin-bottom:20px;}
    .table-panel h3{font-size:.93rem;font-weight:700;color:var(--text-primary);margin:0 0 14px;}
    .rpt-table{width:100%;border-collapse:collapse;font-size:.8rem;}
    .rpt-table th{text-align:left;padding:9px 12px;color:var(--text-secondary);font-weight:600;border-bottom:1px solid var(--glass-border);text-transform:uppercase;font-size:.7rem;letter-spacing:.05em;}
    .rpt-table td{padding:9px 12px;border-bottom:1px solid rgba(255,255,255,.04);color:var(--text-primary);}
    .rpt-table tr:last-child td{border-bottom:none;}
    .rpt-table tr:hover td{background:var(--hover-bg);}
    .badge-status{display:inline-block;padding:2px 9px;border-radius:20px;font-size:.68rem;font-weight:700;text-transform:uppercase;}
    .badge-new{background:rgba(99,179,237,.15);color:#63b3ed;}
    .badge-hired{background:rgba(72,187,120,.15);color:#48bb78;}
    .badge-rejected{background:rgba(252,129,74,.15);color:#fc814a;}
    .badge-shortlisted{background:rgba(236,201,75,.15);color:#ecc94b;}
    .badge-reviewed{background:rgba(160,174,192,.15);color:#a0aec0;}
    .badge-interview{background:rgba(159,122,234,.15);color:#9f7aea;}
    .badge-with_agency{background:rgba(99,179,237,.15);color:#63b3ed;}
    .badge-returned{background:rgba(72,187,120,.15);color:#48bb78;}
    .section-label{font-size:.72rem;font-weight:700;color:var(--accent-primary);text-transform:uppercase;letter-spacing:.1em;margin:28px 0 14px;display:flex;align-items:center;gap:8px;}
    .section-label::after{content:'';flex:1;height:1px;background:var(--glass-border);}
    .no-data{text-align:center;padding:40px;color:var(--text-secondary);font-size:.85rem;}
    .no-data i{font-size:2rem;opacity:.4;margin-bottom:10px;display:block;}
    .rpt-loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:60px;color:var(--text-secondary);}
    .rpt-spinner{width:28px;height:28px;border:3px solid var(--glass-border);border-top-color:var(--accent-primary);border-radius:50%;animation:spin .7s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .rpt-actions{display:flex;gap:8px;}
    .btn-export{background:transparent;border:1px solid var(--glass-border);color:var(--text-secondary);border-radius:7px;padding:7px 14px;font-size:.8rem;cursor:pointer;transition:.2s;display:flex;align-items:center;gap:6px;}
    .btn-export:hover{border-color:var(--accent-primary);color:var(--accent-primary);}
    .tab-content{display:none;}
    .tab-content.active{display:block;}
  </style>
</head>
<body>
<div class="app-wrapper">
  <div id="sidebar-container"></div>
  <div id="sidebar-overlay" class="sidebar-overlay"></div>
  <div class="main-content">
    <div id="navbar-container"></div>
    <div class="page-content">
      <div class="reports-header">
        <div>
          <h1><i class="fas fa-chart-line" style="color:var(--accent-primary);margin-right:10px;"></i>Reports &amp; Analytics</h1>
          <div class="sub">Management-level intelligence from live operational data</div>
        </div>
        <div class="rpt-actions">
          <button class="btn-export" onclick="window.print()"><i class="fas fa-print"></i> Print</button>
          <button class="btn-export" id="btn-refresh"><i class="fas fa-sync-alt"></i> Refresh</button>
        </div>
      </div>
      <div class="rpt-tabs">
        <button class="rpt-tab active" id="tab-crewing" onclick="switchTab('crewing')">
          <i class="fas fa-anchor" style="margin-right:6px;"></i>Crewing &amp; Recruitment
        </button>
        <button class="rpt-tab" id="tab-frontdesk" onclick="switchTab('frontdesk')">
          <i class="fas fa-concierge-bell" style="margin-right:6px;"></i>Front Desk
        </button>
      </div>
      <div class="tab-content active" id="content-crewing">
        <div class="filter-bar">
          <div><label>From</label><input type="date" id="cf-from"></div>
          <div><label>To</label><input type="date" id="cf-to"></div>
          <div><label>Department</label>
            <select id="cf-dept">
              <option value="">All</option>
              <option>DECK</option><option>ENGINE</option><option>CATERING</option><option>ELECTRICAL</option><option>RATING</option>
            </select>
          </div>
          <div><label>Status</label>
            <select id="cf-status">
              <option value="">All</option>
              <option>NEW</option><option>REVIEWED</option><option>SHORTLISTED</option>
              <option>INTERVIEW_SCHEDULED</option><option>REJECTED</option><option>HIRED</option>
            </select>
          </div>
          <button class="filter-apply" onclick="loadCrewingReport()">Apply</button>
          <button class="filter-reset" onclick="resetCrewingFilters()">Reset</button>
        </div>
        <div id="crewing-body">
          <div class="rpt-loading"><div class="rpt-spinner"></div> Loading analytics&hellip;</div>
        </div>
      </div>
      <div class="tab-content" id="content-frontdesk">
        <div class="filter-bar">
          <div><label>From</label><input type="date" id="fd-from"></div>
          <div><label>To</label><input type="date" id="fd-to"></div>
          <button class="filter-apply" onclick="loadFrontDeskReport()">Apply</button>
          <button class="filter-reset" onclick="resetFDFilters()">Reset</button>
        </div>
        <div id="frontdesk-body">
          <div class="rpt-loading"><div class="rpt-spinner"></div> Loading analytics&hellip;</div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="/public/js/api/api.js"></script>
<script src="/public/js/components/sidebar.js"></script>
<script src="/public/js/components/ui.js"></script>
<script>
const _charts={};
function destroyChart(id){if(_charts[id]){_charts[id].destroy();delete _charts[id];}}
const MONTH_NAMES=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const PALETTE=['#00bcbc','#00e5ff','#3b82f6','#8b5cf6','#f59e0b','#ef4444','#10b981','#f97316','#6366f1','#ec4899','#14b8a6','#a855f7'];
function fmtDate(iso){if(!iso)return'—';const d=new Date(iso);return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});}
function fmtTime(iso){if(!iso)return'—';return new Date(iso).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});}
function statusBadge(s){
  const map={NEW:'new',HIRED:'hired',REJECTED:'rejected',SHORTLISTED:'shortlisted',REVIEWED:'reviewed',INTERVIEW_SCHEDULED:'interview',WITH_AGENCY:'with_agency',RETURNED_TO_SEAFARER:'returned',SENT_TO_VESSEL_OWNER:'with_agency'};
  const cls=map[s]||'reviewed';return'<span class="badge-status badge-'+cls+'">'+(s||'').replace(/_/g,' ')+'<\/span>';
}
let _activeTab='crewing';
function switchTab(tab){
  _activeTab=tab;
  document.querySelectorAll('.rpt-tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  document.getElementById('content-'+tab).classList.add('active');
  if(tab==='crewing'&&!_crewingLoaded)loadCrewingReport();
  if(tab==='frontdesk'&&!_fdLoaded)loadFrontDeskReport();
}
let _crewingLoaded=false;
function resetCrewingFilters(){
  ['cf-from','cf-to'].forEach(id=>document.getElementById(id).value='');
  ['cf-dept','cf-status'].forEach(id=>document.getElementById(id).value='');
  loadCrewingReport();
}
async function loadCrewingReport(){
  const params={};
  const from=document.getElementById('cf-from').value;
  const to=document.getElementById('cf-to').value;
  const dept=document.getElementById('cf-dept').value;
  const status=document.getElementById('cf-status').value;
  if(from)params.dateFrom=from;
  if(to)params.dateTo=to;
  if(dept)params.department=dept;
  if(status)params.status=status;
  const body=document.getElementById('crewing-body');
  body.innerHTML='<div class="rpt-loading"><div class="rpt-spinner"></div> Loading analytics&hellip;</div>';
  try{
    const res=await ApiService.reports.getCrewingReport(params);
    _crewingLoaded=true;
    renderCrewingReport(res.data);
  }catch(err){
    body.innerHTML='<div class="no-data"><i class="fas fa-exclamation-triangle"></i>Failed to load: '+(err.message||'Server error')+'</div>';
  }
}
function renderCrewingReport(d){
  const k=d.kpis;
  const convColor=k.conversionRate>=20?'#48bb78':k.conversionRate>=10?'#ecc94b':'#fc814a';
  document.getElementById('crewing-body').innerHTML=`
<div class="kpi-grid">
  <div class="kpi-card" style="--kpi-accent:#00bcbc;"><div class="kpi-icon">📝</div><div class="kpi-value">${k.totalApplications}</div><div class="kpi-label">Total Applications</div></div>
  <div class="kpi-card" style="--kpi-accent:#63b3ed;"><div class="kpi-icon">🆕</div><div class="kpi-value">${k.newApplications}</div><div class="kpi-label">New / Unreviewed</div><div class="kpi-sub">Needs attention</div></div>
  <div class="kpi-card" style="--kpi-accent:#ecc94b;"><div class="kpi-icon">⭐</div><div class="kpi-value">${k.shortlistedCount}</div><div class="kpi-label">Shortlisted</div></div>
  <div class="kpi-card" style="--kpi-accent:#48bb78;"><div class="kpi-icon">✅</div><div class="kpi-value">${k.hiredCount}</div><div class="kpi-label">Hired</div></div>
  <div class="kpi-card" style="--kpi-accent:#fc814a;"><div class="kpi-icon">❌</div><div class="kpi-value">${k.rejectedCount}</div><div class="kpi-label">Rejected</div></div>
  <div class="kpi-card" style="--kpi-accent:${convColor};"><div class="kpi-icon">📊</div><div class="kpi-value">${k.conversionRate}%</div><div class="kpi-label">Conversion Rate</div><div class="kpi-sub">Hired / Total</div></div>
  <div class="kpi-card" style="--kpi-accent:#9f7aea;"><div class="kpi-icon">⚓</div><div class="kpi-value">${k.totalCandidates}</div><div class="kpi-label">Seafarers Directory</div></div>
  <div class="kpi-card" style="--kpi-accent:#00e5ff;"><div class="kpi-icon">🟢</div><div class="kpi-value">${k.availableCandidates}</div><div class="kpi-label">Available Now</div><div class="kpi-sub">Ready to deploy</div></div>
</div>
<div class="section-label"><i class="fas fa-chart-bar"></i> Pipeline &amp; Trends</div>
<div class="charts-row two">
  <div class="chart-panel"><h3>Application Pipeline by Status</h3><div class="chart-wrap"><canvas id="c-pipeline"></canvas></div></div>
  <div class="chart-panel"><h3>Monthly Application Trend</h3><div class="chart-wrap"><canvas id="c-trend"></canvas></div></div>
</div>
<div class="section-label"><i class="fas fa-users"></i> Talent Pool Analysis</div>
<div class="charts-row three">
  <div class="chart-panel"><h3>Top Ranks Applied For</h3><div class="chart-wrap tall"><canvas id="c-rank"></canvas></div></div>
  <div class="chart-panel"><h3>Department Distribution</h3><div class="chart-wrap tall"><canvas id="c-dept"></canvas></div></div>
  <div class="chart-panel"><h3>Top Nationalities (Directory)</h3><div class="chart-wrap tall"><canvas id="c-nat"></canvas></div></div>
</div>
<div class="charts-row two">
  <div class="chart-panel"><h3>Seafarer Availability Status</h3><div class="chart-sub">Live snapshot from Seafarers Directory</div><div class="chart-wrap"><canvas id="c-avail"></canvas></div></div>
  <div class="chart-panel"><h3>COC Identity Health</h3><div class="chart-sub">Records with vs. without COC Number</div><div class="chart-wrap"><canvas id="c-coc"></canvas></div></div>
</div>
<div class="section-label"><i class="fas fa-bell"></i> Attention Queue — New Applications</div>
<div class="table-panel"><h3>Unreviewed Applications <span style="font-weight:400;color:var(--text-secondary);font-size:.8rem;">(latest 8)</span></h3>${renderAttentionTable(d.attentionQueue)}</div>
<div class="section-label"><i class="fas fa-share-alt"></i> Referral Source</div>
<div class="charts-row two">
  <div class="chart-panel"><h3>Application Source Breakdown</h3><div class="chart-wrap"><canvas id="c-source"></canvas></div></div>
  <div class="chart-panel"><h3>Workflow Stage (Directory)</h3><div class="chart-wrap"><canvas id="c-workflow"></canvas></div></div>
</div>
`;
  requestAnimationFrame(()=>_renderCrewingCharts(d));
}
function renderAttentionTable(queue){
  if(!queue||!queue.length)return'<div class="no-data"><i class="fas fa-check-circle"></i>No pending new applications</div>';
  return'<table class="rpt-table"><thead><tr><th>Name</th><th>Rank</th><th>Dept</th><th>Nationality</th><th>COC No.</th><th>Applied</th><th>Status</th></tr></thead><tbody>'+
  queue.map(a=>'<tr><td>'+(a.fullName||'—')+'</td><td>'+(a.rankAppliedFor||'—')+'</td><td>'+(a.department||'—')+'</td><td>'+(a.nationality||'—')+'</td><td><code style="font-size:.75rem;color:var(--accent-primary);">'+(a.cocNumber||'—')+'</code></td><td>'+fmtDate(a.createdAt)+'</td><td>'+statusBadge(a.status)+'</td></tr>').join('')+
  '</tbody></table>';
}
function _getTextColor(){return getComputedStyle(document.documentElement).getPropertyValue('--text-secondary').trim()||'#94a3b8';}
function _renderCrewingCharts(d){
  const tf={family:'inherit',size:11},gc='rgba(255,255,255,0.06)',tc=_getTextColor();
  destroyChart('c-pipeline');
  if(d.pipelineByStatus&&d.pipelineByStatus.length){
    _charts['c-pipeline']=new Chart(document.getElementById('c-pipeline'),{type:'doughnut',data:{labels:d.pipelineByStatus.map(x=>x._id||'Unknown'),datasets:[{data:d.pipelineByStatus.map(x=>x.count),backgroundColor:PALETTE,borderWidth:2,borderColor:'transparent'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{color:tc,font:tf,padding:10}}}}});
  }
  destroyChart('c-trend');
  if(d.trendMonthly&&d.trendMonthly.length){
    const lb=d.trendMonthly.map(x=>MONTH_NAMES[x._id.month-1]+' '+String(x._id.year).slice(-2));
    _charts['c-trend']=new Chart(document.getElementById('c-trend'),{type:'line',data:{labels:lb,datasets:[{label:'Applications',data:d.trendMonthly.map(x=>x.count),borderColor:'#00bcbc',backgroundColor:'rgba(0,188,188,.12)',fill:true,tension:.4,pointRadius:3},{label:'Hired',data:d.trendMonthly.map(x=>x.hired),borderColor:'#48bb78',backgroundColor:'rgba(72,187,120,.12)',fill:true,tension:.4,pointRadius:3}]},options:{responsive:true,maintainAspectRatio:false,scales:{x:{ticks:{color:tc,font:tf},grid:{color:gc}},y:{ticks:{color:tc,font:tf},grid:{color:gc},beginAtZero:true}},plugins:{legend:{labels:{color:tc,font:tf}}}}});
  }
  destroyChart('c-rank');
  if(d.rankDistribution&&d.rankDistribution.length){
    _charts['c-rank']=new Chart(document.getElementById('c-rank'),{type:'bar',data:{labels:d.rankDistribution.map(x=>x._id||'Unknown'),datasets:[{data:d.rankDistribution.map(x=>x.count),backgroundColor:'rgba(0,188,188,.7)',borderRadius:4}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:tc,font:tf},grid:{color:gc}},y:{ticks:{color:tc,font:{size:10}},grid:{color:'transparent'}}}}});
  }
  destroyChart('c-dept');
  if(d.deptDistribution&&d.deptDistribution.length){
    _charts['c-dept']=new Chart(document.getElementById('c-dept'),{type:'pie',data:{labels:d.deptDistribution.map(x=>x._id||'Unknown'),datasets:[{data:d.deptDistribution.map(x=>x.count),backgroundColor:PALETTE,borderWidth:2,borderColor:'transparent'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{color:tc,font:tf,padding:8}}}}});
  }
  destroyChart('c-nat');
  if(d.nationalityTop&&d.nationalityTop.length){
    _charts['c-nat']=new Chart(document.getElementById('c-nat'),{type:'bar',data:{labels:d.nationalityTop.map(x=>x._id||'Unknown'),datasets:[{data:d.nationalityTop.map(x=>x.count),backgroundColor:PALETTE.slice(0,10),borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:tc,font:{size:10}},grid:{color:gc}},y:{ticks:{color:tc,font:tf},grid:{color:gc},beginAtZero:true}}}});
  }
  destroyChart('c-avail');
  if(d.availabilityBreakdown&&d.availabilityBreakdown.length){
    _charts['c-avail']=new Chart(document.getElementById('c-avail'),{type:'doughnut',data:{labels:d.availabilityBreakdown.map(x=>x._id||'Unknown'),datasets:[{data:d.availabilityBreakdown.map(x=>x.count),backgroundColor:PALETTE,borderWidth:2,borderColor:'transparent'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{color:tc,font:tf}}}}});
  }
  destroyChart('c-coc');
  _charts['c-coc']=new Chart(document.getElementById('c-coc'),{type:'doughnut',data:{labels:['With COC','Missing COC'],datasets:[{data:[d.cocHealth.withCoc,d.cocHealth.withoutCoc],backgroundColor:['#00bcbc','rgba(252,129,74,.7)'],borderWidth:2,borderColor:'transparent'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{color:tc,font:tf}}}}});
  destroyChart('c-source');
  if(d.sourceBreakdown&&d.sourceBreakdown.length){
    _charts['c-source']=new Chart(document.getElementById('c-source'),{type:'bar',data:{labels:d.sourceBreakdown.map(x=>x._id||'Unknown'),datasets:[{data:d.sourceBreakdown.map(x=>x.count),backgroundColor:PALETTE,borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:tc,font:{size:10}},grid:{color:gc}},y:{ticks:{color:tc,font:tf},grid:{color:gc},beginAtZero:true}}}});
  }
  destroyChart('c-workflow');
  if(d.workflowBreakdown&&d.workflowBreakdown.length){
    _charts['c-workflow']=new Chart(document.getElementById('c-workflow'),{type:'pie',data:{labels:d.workflowBreakdown.map(x=>x._id||'Unknown'),datasets:[{data:d.workflowBreakdown.map(x=>x.count),backgroundColor:PALETTE,borderWidth:2,borderColor:'transparent'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{color:tc,font:tf}}}}});
  }
}
let _fdLoaded=false;
function resetFDFilters(){
  ['fd-from','fd-to'].forEach(id=>document.getElementById(id).value='');
  loadFrontDeskReport();
}
async function loadFrontDeskReport(){
  const params={};
  const from=document.getElementById('fd-from').value;
  const to=document.getElementById('fd-to').value;
  if(from)params.dateFrom=from;
  if(to)params.dateTo=to;
  const body=document.getElementById('frontdesk-body');
  body.innerHTML='<div class="rpt-loading"><div class="rpt-spinner"></div> Loading analytics&hellip;</div>';
  try{
    const res=await ApiService.reports.getFrontDeskReport(params);
    _fdLoaded=true;
    renderFrontDeskReport(res.data);
  }catch(err){
    body.innerHTML='<div class="no-data"><i class="fas fa-exclamation-triangle"></i>Failed to load: '+(err.message||'Server error')+'</div>';
  }
}
function renderFrontDeskReport(d){
  const k=d.kpis;
  document.getElementById('frontdesk-body').innerHTML=`
<div class="kpi-grid">
  <div class="kpi-card" style="--kpi-accent:#00bcbc;"><div class="kpi-icon">🧑‍🤝‍🧑</div><div class="kpi-value">${k.totalVisitors}</div><div class="kpi-label">Total Visitors</div></div>
  <div class="kpi-card" style="--kpi-accent:#48bb78;"><div class="kpi-icon">✔️</div><div class="kpi-value">${k.checkedOutVisitors}</div><div class="kpi-label">Checked Out</div></div>
  <div class="kpi-card" style="--kpi-accent:#ecc94b;"><div class="kpi-icon">🏠</div><div class="kpi-value">${k.stillInside}</div><div class="kpi-label">Still Inside</div><div class="kpi-sub">Currently present</div></div>
  <div class="kpi-card" style="--kpi-accent:#3b82f6;"><div class="kpi-icon">⏱️</div><div class="kpi-value">${k.avgVisitMinutes}</div><div class="kpi-label">Avg. Visit (min)</div></div>
  <div class="kpi-card" style="--kpi-accent:#9f7aea;"><div class="kpi-icon">📞</div><div class="kpi-value">${k.totalCalls}</div><div class="kpi-label">Total Calls Logged</div></div>
  <div class="kpi-card" style="--kpi-accent:#fc814a;"><div class="kpi-icon">⏳</div><div class="kpi-value">${k.pendingCalls}</div><div class="kpi-label">Pending Calls</div><div class="kpi-sub">Needs action</div></div>
  <div class="kpi-card" style="--kpi-accent:#00e5ff;"><div class="kpi-icon">📁</div><div class="kpi-value">${k.totalDocs}</div><div class="kpi-label">Documents Held</div></div>
  <div class="kpi-card" style="--kpi-accent:#f59e0b;"><div class="kpi-icon">🏛️</div><div class="kpi-value">${k.withAgency}</div><div class="kpi-label">With Agency</div><div class="kpi-sub">Pending return</div></div>
</div>
<div class="section-label"><i class="fas fa-user-friends"></i> Visitor Analytics</div>
<div class="charts-row two">
  <div class="chart-panel"><h3>Visitor Traffic <span style="font-weight:400;color:var(--text-secondary);">(last 30 days)</span></h3><div class="chart-wrap tall"><canvas id="c-vday"></canvas></div></div>
  <div class="chart-panel"><h3>Visitors by Purpose</h3><div class="chart-wrap tall"><canvas id="c-vpurpose"></canvas></div></div>
</div>
<div class="section-label"><i class="fas fa-file-alt"></i> Document Custody Analytics</div>
<div class="charts-row two">
  <div class="chart-panel"><h3>Documents by Type</h3><div class="chart-wrap"><canvas id="c-doctype"></canvas></div></div>
  <div class="chart-panel"><h3>Documents by Custody Status</h3><div class="chart-wrap"><canvas id="c-doccustody"></canvas></div></div>
</div>
<div class="section-label"><i class="fas fa-exclamation-circle"></i> Documents Still With Agency</div>
<div class="table-panel"><h3>Pending Returns <span style="font-weight:400;color:var(--text-secondary);font-size:.8rem;">(latest 10)</span></h3>${renderDocAgencyTable(d.docsWithAgency)}</div>
<div class="section-label"><i class="fas fa-history"></i> Recent Visitors</div>
<div class="table-panel"><h3>Visitor Log <span style="font-weight:400;color:var(--text-secondary);font-size:.8rem;">(latest 10)</span></h3>${renderVisitorTable(d.recentVisitors)}</div>
`;
  requestAnimationFrame(()=>_renderFDCharts(d));
}
function renderDocAgencyTable(docs){
  if(!docs||!docs.length)return'<div class="no-data"><i class="fas fa-check-circle"></i>No documents with agency</div>';
  return'<table class="rpt-table"><thead><tr><th>Seafarer</th><th>Doc Type</th><th>Doc No.</th><th>Location</th><th>Collected</th><th>Status</th></tr></thead><tbody>'+
  docs.map(doc=>'<tr><td>'+(doc.seafarerName||'—')+'</td><td>'+((doc.documentType||[]).join(', '))+'</td><td>'+(doc.documentNumber||'—')+'</td><td>'+(doc.custodyLocation||'—')+'</td><td>'+fmtDate(doc.createdAt)+'</td><td>'+statusBadge(doc.status)+'</td></tr>').join('')+
  '</tbody></table>';
}
function renderVisitorTable(visitors){
  if(!visitors||!visitors.length)return'<div class="no-data"><i class="fas fa-users"></i>No visitor records</div>';
  return'<table class="rpt-table"><thead><tr><th>Name</th><th>Phone</th><th>Company</th><th>Purpose</th><th>Contact Person</th><th>In</th><th>Out</th></tr></thead><tbody>'+
  visitors.map(v=>'<tr><td>'+(v.name||'—')+'</td><td>'+(v.phone||'—')+'</td><td>'+(v.company||'—')+'</td><td>'+(v.purpose||'—')+'</td><td>'+(v.contactPerson||'—')+'</td><td>'+fmtTime(v.checkInTime)+'</td><td>'+(v.checkOutTime?fmtTime(v.checkOutTime):'<span style="color:var(--accent-primary);font-weight:600;">Still inside</span>')+'</td></tr>').join('')+
  '</tbody></table>';
}
function _renderFDCharts(d){
  const tf={family:'inherit',size:11},gc='rgba(255,255,255,0.06)',tc=_getTextColor();
  destroyChart('c-vday');
  if(d.visitorsByDay&&d.visitorsByDay.length){
    _charts['c-vday']=new Chart(document.getElementById('c-vday'),{type:'line',data:{labels:d.visitorsByDay.map(x=>x._id.day+'/'+x._id.month),datasets:[{label:'Visitors',data:d.visitorsByDay.map(x=>x.count),borderColor:'#00bcbc',backgroundColor:'rgba(0,188,188,.12)',fill:true,tension:.4,pointRadius:2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:tc,font:{size:10},maxTicksLimit:15},grid:{color:gc}},y:{ticks:{color:tc,font:tf},grid:{color:gc},beginAtZero:true}}}});
  }
  destroyChart('c-vpurpose');
  if(d.visitorsByPurpose&&d.visitorsByPurpose.length){
    _charts['c-vpurpose']=new Chart(document.getElementById('c-vpurpose'),{type:'doughnut',data:{labels:d.visitorsByPurpose.map(x=>x._id),datasets:[{data:d.visitorsByPurpose.map(x=>x.count),backgroundColor:PALETTE,borderWidth:2,borderColor:'transparent'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{color:tc,font:tf,padding:8}}}}});
  }
  destroyChart('c-doctype');
  if(d.docsByType&&d.docsByType.length){
    _charts['c-doctype']=new Chart(document.getElementById('c-doctype'),{type:'bar',data:{labels:d.docsByType.map(x=>x._id),datasets:[{data:d.docsByType.map(x=>x.count),backgroundColor:PALETTE,borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:tc,font:tf},grid:{color:gc}},y:{ticks:{color:tc,font:tf},grid:{color:gc},beginAtZero:true}}}});
  }
  destroyChart('c-doccustody');
  if(d.docsByCustody&&d.docsByCustody.length){
    const cl={WITH_AGENCY:'With Agency',RETURNED_TO_SEAFARER:'Returned',SENT_TO_VESSEL_OWNER:'Sent to Vessel'};
    _charts['c-doccustody']=new Chart(document.getElementById('c-doccustody'),{type:'doughnut',data:{labels:d.docsByCustody.map(x=>cl[x._id]||x._id),datasets:[{data:d.docsByCustody.map(x=>x.count),backgroundColor:['#3b82f6','#48bb78','#9f7aea'],borderWidth:2,borderColor:'transparent'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{color:tc,font:tf}}}}});
  }
}
document.addEventListener('DOMContentLoaded',()=>{
  const user=JSON.parse(localStorage.getItem('user')||'null');
  if(!user||!localStorage.getItem('token')){window.location.href='/pages/login.html';return;}
  const allowed=['ADMIN','DIRECTOR','COO','HR','MANAGER','SOURCING_MANAGER'];
  if(!allowed.includes(user.role)){
    document.getElementById('crewing-body').innerHTML='<div class="no-data"><i class="fas fa-lock"></i>You do not have permission to view this page.</div>';
    return;
  }
  if(window.initSidebar)initSidebar();
  if(window.initNavbar)initNavbar();
  loadCrewingReport();
  document.getElementById('btn-refresh').addEventListener('click',()=>{
    if(_activeTab==='crewing'){_crewingLoaded=false;loadCrewingReport();}
    if(_activeTab==='frontdesk'){_fdLoaded=false;loadFrontDeskReport();}
  });
});
</script>
</body>
</html>
