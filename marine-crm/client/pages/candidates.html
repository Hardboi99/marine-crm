<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seafarers Directory - Marine CRM</title>
    <link rel="stylesheet" href="/public/css/styles1.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>

<body>
    <div class="app-wrapper">
        <div id="sidebar-container"></div>
        <div id="sidebar-overlay" class="sidebar-overlay"></div>
        <div class="main-content">
            <div id="navbar-container"></div>
            <main class="page-content">
                <div class="page-header">
                    <div>
                        <h1 class="page-title">👨‍✈️ Seafarers Directory</h1>
                        <p class="page-subtitle">Manage qualified seafarer candidate database</p>
                    </div>
                    <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                        <a href="/pages/crew-tracker.html" class="btn btn-secondary" style="display: inline-flex; align-items: center; gap: 8px; color: #0ea5e9;">
                            <i class="fas fa-stopwatch"></i> Crew Sign-Off Tracker
                        </a>
                        <button id="export-candidates-btn" class="btn btn-secondary" style="display: inline-flex; align-items: center; gap: 8px;">
                            <i class="fas fa-file-excel" style="color: #107c41;"></i> Export to Excel
                        </button>
                        <button id="add-candidate-btn" class="btn btn-primary">
                            <i class="fas fa-plus"></i> Add Seafarer
                        </button>
                    </div>
                </div>

                <div class="filter-bar">
                    <div class="filter-group">

                        <input type="text" id="search-input" class="form-control"
                            placeholder="Search by name, location or email...">
                    </div>
                    <div class="filter-group">
                        <select id="rank-filter" class="form-control">
                            <option value="">All Ranks</option>
                            <optgroup label="Deck Side">
                                <option value="Master">Master</option>
                                <option value="Chief Officer">Chief Officer</option>
                                <option value="2nd Officer">2nd Officer</option>
                                <option value="3rd Officer">3rd Officer</option>
                                <option value="Junior Officer">Junior Officer</option>
                                <option value="Bosun">Bosun</option>
                                <option value="AB">AB</option>
                                <option value="OS">OS</option>
                            </optgroup>
                            <optgroup label="Engine Side">
                                <option value="Chief Engineer">Chief Engineer</option>
                                <option value="2E">Chief Mate / 2nd Engineer</option>
                                <option value="3E">3rd Engineer</option>
                                <option value="4E">4th Engineer</option>
                                <option value="ETO">Electro-Technical Officer</option>
                                <option value="Fitter">Fitter</option>
                                <option value="Oiler">Oiler</option>
                                <option value="Wiper">Wiper</option>
                            </optgroup>
                            <optgroup label="Galley">
                                <option value="Cook">Cook</option>
                                <option value="Messman">Messman</option>
                            </optgroup>
                        </select>
                    </div>
                    <div class="filter-group">
                        <select id="status-filter" class="form-control">
                            <option value="">All Statuses</option>
                            <option value="AVAILABLE">AVAILABLE</option>
                            <option value="SHORTLISTED">SHORTLISTED</option>
                            <option value="PROPOSED">PROPOSED</option>
                            <option value="APPROVED">APPROVED</option>
                            <option value="DOCUMENTATION">DOCUMENTATION</option>
                            <option value="ONBOARDED">ONBOARDED</option>
                            <option value="REJECTED_TALENT_POOL">TALENT POOL</option>
                        </select>
                    </div>
                </div>

                <div class="card">
                    <div class="card-body">
                        <div class="table-container">
                            <table id="candidates-table" class="table">
                                <thead>
                                    <tr>
                                        <th>Name</th>
                                        <th>Rank</th>
                                        <th>Added By</th>
                                        <th>Availability & Schedule</th>
                                        <th>Status</th>
                                        <th>Wages</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="candidates-tbody">
                                    <!-- Skeleton loader initially -->
                                    <tr class="skeleton-row">
                                        <td>
                                            <div class="skeleton-box"></div>
                                        </td>
                                        <td>
                                            <div class="skeleton-box"></div>
                                        </td>
                                        <td>
                                            <div class="skeleton-box"></div>
                                        </td>
                                        <td>
                                            <div class="skeleton-box"></div>
                                        </td>
                                        <td>
                                            <div class="skeleton-box"></div>
                                        </td>
                                        <td>
                                            <div class="skeleton-box"></div>
                                        </td>
                                        <td>
                                            <div class="skeleton-box"></div>
                                        </td>
                                    </tr>
                                    <tr class="skeleton-row">
                                        <td>
                                            <div class="skeleton-box"></div>
                                        </td>
                                        <td>
                                            <div class="skeleton-box"></div>
                                        </td>
                                        <td>
                                            <div class="skeleton-box"></div>
                                        </td>
                                        <td>
                                            <div class="skeleton-box"></div>
                                        </td>
                                        <td>
                                            <div class="skeleton-box"></div>
                                        </td>
                                        <td>
                                            <div class="skeleton-box"></div>
                                        </td>
                                        <td>
                                            <div class="skeleton-box"></div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <div id="empty-state" class="empty-state" style="display: none;">
                            <i class="fas fa-user-slash fa-3x"></i>
                            <p>No seafarers found matching your criteria.</p>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <script src="/public/js/api/api.js"></script>
    <script src="/public/js/components/ui.js"></script>
    <script src="/public/js/components/sidebar.js"></script>
    <script src="/public/js/components/birthday.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let candidatesData = [];
            let currentEditId = null;
            let _candidateModal = null;
            let expCount = 0;

            const tbody = document.getElementById('candidates-tbody');
            const _loggedInUserRole = (JSON.parse(localStorage.getItem('user') || '{}').role) || '';
            const searchInput = document.getElementById('search-input');
            const rankFilter = document.getElementById('rank-filter');
            const statusFilter = document.getElementById('status-filter');
            const emptyState = document.getElementById('empty-state');

            async function fetchData() {
                try {
                    const res = await window.ApiService.crewing.candidates.getAll();
                    candidatesData = res.data || [];

                    // Check URL for ?search=
                    const params = new URLSearchParams(window.location.search);
                    const qSearch = params.get('search') || params.get('coc');
                    if (qSearch && searchInput) {
                        searchInput.value = qSearch;
                    }

                    renderTable();
                } catch (error) {
                    console.error('Error fetching candidates:', error);
                    if (window.UI?.showToast) window.UI.showToast('Failed to load seafarers', 'error');
                }
            }

            function renderTable() {
                const search = searchInput.value.toLowerCase().trim();
                const rank = rankFilter.value;
                const status = statusFilter.value;

                const filtered = candidatesData.filter(c => {
                    const matchSearch = !search ||
                        (c.name || '').toLowerCase().includes(search) ||
                        (c.seafarerId || '').toLowerCase().includes(search) ||
                        (c.applicationId || '').toLowerCase().includes(search) ||
                        (c.cocNumber || '').toLowerCase().includes(search) ||
                        (c.nationality || '').toLowerCase().includes(search) ||
                        (c.currentVessel || '').toLowerCase().includes(search) ||
                        (c.email || '').toLowerCase().includes(search);
                    const matchRank = rank ? c.rank === rank : true;
                    const matchStatus = status ? c.status === status : true;
                    return matchSearch && matchRank && matchStatus;
                });

                tbody.innerHTML = '';
                if (filtered.length === 0) {
                    emptyState.style.display = 'block';
                    document.getElementById('candidates-table').style.display = 'none';
                } else {
                    emptyState.style.display = 'none';
                    document.getElementById('candidates-table').style.display = 'table';
                    filtered.forEach(c => {
                        const tr = document.createElement('tr');
                        const formatAvail = c.availableFrom ? new Date(c.availableFrom).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '—';
                        const canSeeDocs = ['ADMIN', 'DIRECTOR', 'COO', 'DOCUMENTATION_MANAGER', 'DOCUMENTATION_OFFICER'].includes(_loggedInUserRole);
                        const seafarerIdDisplay = c.seafarerId || c.applicationId || (c.id ? c.id.slice(-5).toUpperCase() : '');
                        const cocDisplay = c.cocNumber || '—';
                        const scheduleBadge = getContractScheduleBadge(c);
                        tr.innerHTML = `
                            <td>
                                <div><strong style="color: var(--text-primary); font-size: 0.92rem;">${escapeHtml(c.name)}</strong></div>
                                ${seafarerIdDisplay ? `<div style="font-size: 0.75rem; color: var(--accent-primary); font-weight: 600; margin-top: 2px;">${escapeHtml(seafarerIdDisplay)}</div>` : ''}
                                ${c.cocNumber ? `<div style="font-size: 0.72rem; color: var(--text-muted); margin-top: 1px;">COC: <span style="font-weight: 600; color: var(--text-secondary);">${escapeHtml(cocDisplay)}</span></div>` : ''}
                            </td>
                            <td>
                                <span class="badge badge-blue">${escapeHtml(c.rank)}</span>
                                ${c.vesselType ? `<div style="font-size:0.75rem; color:var(--text-secondary); margin-top:3px;"><i class="fas fa-ship" style="font-size:0.7rem; margin-right:3px;"></i>${escapeHtml(c.vesselType)}</div>` : ''}
                            </td>
                            <td>${renderAddedBy(c.createdById)}</td>
                            <td>
                                <div>${formatAvail}</div>
                                ${scheduleBadge}
                            </td>
                            <td>
                                ${window.UI?.renderStatusBadge ? window.UI.renderStatusBadge(c.status) : `<span class="badge">${c.status}</span>`}
                            </td>
                            <td>
                                <div style="font-size: 0.85rem;">Exp: ${c.experienceYears || 0} yrs</div>
                                <div style="font-weight: 600; color: var(--accent-primary);">Exp Salary: $${c.expectedSalary || 0}/m</div>
                            </td>
                            <td class="row-actions">
                                <button class="btn btn-secondary btn-sm" onclick="showContractTracker('${c.id}')" title="Live Crew Departure & Expiration Tracker" style="color: #0ea5e9;"><i class="fas fa-stopwatch"></i></button>
                                <button class="btn btn-primary btn-sm" onclick="viewCandidateProfile('${c.id}')" title="View Profile & Application History"><i class="fas fa-eye"></i></button>
                                <button class="btn btn-secondary btn-sm" onclick="editCandidate('${c.id}')" title="Edit Profile"><i class="fas fa-user-edit"></i></button>
                                ${canSeeDocs ? `<a class="btn btn-secondary btn-sm" href="/pages/documents.html?candidateId=${c.id}&name=${encodeURIComponent(c.name || '')}" title="View Documents"><i class="fas fa-folder-open"></i></a>` : ''}
                                <button class="btn btn-danger btn-sm" onclick="deleteCandidate('${c.id}')" title="Delete Profile"><i class="fas fa-trash"></i></button>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
            }

            function toDateTimeLocalInput(dateVal) {
                if (!dateVal) return '';
                const d = new Date(dateVal);
                if (isNaN(d.getTime())) return '';
                const pad = n => String(n).padStart(2, '0');
                const yyyy = d.getFullYear();
                const mm = pad(d.getMonth() + 1);
                const dd = pad(d.getDate());
                const hh = pad(d.getHours());
                const min = pad(d.getMinutes());
                return `${yyyy}-${mm}-${dd}T${hh}:${min}`;
            }

            function getContractScheduleBadge(c) {
                if (!c.onboardingDateTime && !c.signOffDateTime) {
                    return '';
                }
                const now = new Date().getTime();
                const onDate = c.onboardingDateTime ? new Date(c.onboardingDateTime).getTime() : null;
                const offDate = c.signOffDateTime ? new Date(c.signOffDateTime).getTime() : null;

                if (offDate && now > offDate) {
                    return `
                        <div style="margin-top: 5px;">
                            <span class="badge" style="background: rgba(239, 68, 68, 0.12); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.25); font-size: 0.72rem; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px;" onclick="showContractTracker('${c.id}')" title="Click to view live contract & departure tracker">
                                <i class="fas fa-hourglass-end"></i> Expired ${new Date(offDate).toLocaleDateString()}
                            </span>
                        </div>
                    `;
                } else if (offDate && (!onDate || now >= onDate)) {
                    const diffMs = offDate - now;
                    const days = Math.floor(diffMs / (1000 * 60 * 60 * 24));
                    const hours = Math.floor((diffMs % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const isWarning = days < 14;
                    const bg = isWarning ? 'rgba(234, 179, 8, 0.15)' : 'rgba(16, 185, 129, 0.15)';
                    const color = isWarning ? '#eab308' : '#10b981';
                    const border = isWarning ? 'rgba(234, 179, 8, 0.3)' : 'rgba(16, 185, 129, 0.3)';
                    return `
                        <div style="margin-top: 5px;">
                            <span class="badge" style="background: ${bg}; color: ${color}; border: 1px solid ${border}; font-size: 0.72rem; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px;" onclick="showContractTracker('${c.id}')" title="Click to view live contract & departure tracker">
                                <i class="fas fa-ship"></i> ${isWarning ? 'Leaves' : 'Onboard'}: ${days}d ${hours}h
                            </span>
                        </div>
                    `;
                } else if (onDate && now < onDate) {
                    const diffMs = onDate - now;
                    const days = Math.floor(diffMs / (1000 * 60 * 60 * 24));
                    return `
                        <div style="margin-top: 5px;">
                            <span class="badge" style="background: rgba(14, 165, 233, 0.12); color: #0ea5e9; border: 1px solid rgba(14, 165, 233, 0.25); font-size: 0.72rem; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px;" onclick="showContractTracker('${c.id}')" title="Click to view live contract & departure tracker">
                                <i class="fas fa-calendar-check"></i> Boards in ${days}d
                            </span>
                        </div>
                    `;
                }
                return '';
            }

            function escapeHtml(str) {
                if (!str) return '';
                return String(str)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#039;');
            }

            // Readable labels for role codes — display only, never used for
            // access logic (permissions stay entirely on the backend).
            const ROLE_LABELS = {
                ADMIN: 'Admin',
                COO: 'COO',
                DIRECTOR: 'Director',
                SOURCING_MANAGER: 'Sourcing Manager',
                SOURCING_OFFICER: 'Sourcing Officer',
                DOCUMENTATION_MANAGER: 'Documentation Manager',
                DOCUMENTATION_OFFICER: 'Documentation Officer',
                ACCOUNTS_OFFICER: 'Accounts Officer',
                HR: 'HR',
            };

            // "Added By" cell — always derived from the candidate's own
            // createdById (populated by the backend), never from the
            // frontend/form. Falls back to "Unknown" for old records
            // where createdById is missing/unpopulated.
            function renderAddedBy(creator) {
                if (!creator) {
                    // TEMP DEBUG — remove once "Added By" is confirmed working.
                    console.warn('renderAddedBy: createdById is missing/null on this candidate.');
                    return `<div><strong>Unknown</strong></div>`;
                }
                if (typeof creator !== 'object') {
                    // createdById came back as a raw id string, NOT a populated
                    // User object — the backend .populate() isn't taking effect
                    // (stale server process, wrong file deployed, or a cached
                    // response). This is the #1 real-world cause of "Unknown"
                    // showing even for brand-new candidates.
                    console.warn('renderAddedBy: createdById is not populated — got a raw id:', creator);
                    return `<div><strong>Unknown</strong></div>`;
                }
                const name = creator.name || creator.email;
                if (!name) {
                    console.warn('renderAddedBy: populated createdById has no name/email:', creator);
                    return `<div><strong>Unknown</strong></div>`;
                }
                const roleLabel = ROLE_LABELS[creator.role] || escapeHtml(creator.role || '');
                return `
                    <div><strong>${escapeHtml(name)}</strong></div>
                    <div style="font-size:0.8rem; color:var(--text-secondary);">${escapeHtml(roleLabel)}</div>
                `;
            }

            searchInput.addEventListener('input', renderTable);
            rankFilter.addEventListener('change', renderTable);
            statusFilter.addEventListener('change', renderTable);

            document.getElementById('add-candidate-btn').addEventListener('click', () => {
                currentEditId = null;
                openCandidateModal();
            });

            window.editCandidate = (id) => {
                currentEditId = id;
                const candidate = candidatesData.find(c => c.id === id);
                if (candidate) openCandidateModal(candidate);
            };

            function openCandidateModal(c = null) {
                const title = c ? 'Edit Seafarer Profile' : 'Register New Seafarer';
                expCount = 0;

                const rankOptions = [
                    'Master', 'Chief Officer', '2nd Officer', '3rd Officer', 'Junior Officer', 'Bosun', 'AB', 'OS',
                    'Chief Engineer', '2E', '3E', '4E', 'ETO', 'Fitter', 'Oiler', 'Wiper',
                    'Cook', 'Messman'
                ].map(r => `<option value="${r}" ${c && c.rank === r ? 'selected' : ''}>${r}</option>`).join('');

                const vesselTypeOptions = [
                    'Tanker', 'Bulk Carrier', 'Container', 'RoRo', 'Gas Carrier'
                ].map(v => `<option value="${v}" ${c && (c.vesselType === v || (v === 'RoRo' && c.vesselType === 'Ro-Ro')) ? 'selected' : ''}>${v}</option>`).join('');

                const bodyHtml = `
                    <form id="candidate-form" style="max-height: 70vh; overflow-y: auto; padding-right: 8px;">
                        <h3 style="border-bottom: 1px solid var(--border-color); padding-bottom: 5px; margin-bottom: 12px; color: var(--accent-primary); display:flex; justify-content:space-between; align-items:center;">
                            <span>General Info</span>
                            ${c && (c.seafarerId || c.applicationId) ? `<span style="font-size:0.8rem; background:rgba(16, 185, 129, 0.15); color:#10b981; padding:2px 8px; border-radius:4px; font-weight:600;">ID: ${escapeHtml(c.seafarerId || c.applicationId)}</span>` : ''}
                        </h3>
                        <div class="form-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
                            <div class="form-group">
                                <label class="form-label">Full Name *</label>
                                <input type="text" id="cand-name" class="form-control" value="${c ? c.name : ''}" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Rank *</label>
                                <select id="cand-rank" class="form-control" required>
                                    <option value="">Select Rank</option>
                                    ${rankOptions}
                                </select>
                            </div>
                        </div>

                        <div class="form-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
                            <div class="form-group">
                                <label class="form-label">Vessel Type *</label>
                                <select id="cand-vessel-type" class="form-control">
                                    <option value="">Select Vessel Type</option>
                                    ${vesselTypeOptions}
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Nationality</label>
                                <input type="text" id="cand-nationality" class="form-control" value="${c ? c.nationality || '' : ''}" placeholder="e.g. Ukraine">
                            </div>
                        </div>

                        <div class="form-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
                            <div class="form-group">
                                <label class="form-label">Current Vessel</label>
                                <input type="text" id="cand-vessel" class="form-control" value="${c ? c.currentVessel || '' : ''}" placeholder="e.g. MV Ocean Star">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Phone</label>
                                <input type="tel" id="cand-phone" class="form-control" value="${c ? c.phone || '' : ''}" placeholder="+380...">
                            </div>
                        </div>

                        <div class="form-group" style="margin-bottom: 15px;">
                            <label class="form-label">Email Address</label>
                            <input type="email" id="cand-email" class="form-control" value="${c ? c.email || '' : ''}">
                        </div>

                        <h3 style="border-bottom: 1px solid var(--border-color); padding-bottom: 5px; margin-bottom: 12px; color: var(--accent-primary);">Certificates</h3>
                        <div class="form-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
                            <div class="form-group">
                                <label class="form-label">Passport Number</label>
                                <input type="text" id="cand-passport-no" class="form-control" value="${c ? c.passportNumber || '' : ''}">
                            </div>
                            <div class="form-group">
                                <label class="form-label">COC Number</label>
                                <input type="text" id="cand-coc-no" class="form-control" value="${c ? c.cocNumber || '' : ''}">
                            </div>
                        </div>

                        <h3 style="border-bottom: 1px solid var(--border-color); padding-bottom: 5px; margin-bottom: 12px; color: var(--accent-primary);">Experience & Availability</h3>
                        <div class="form-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
                            <div class="form-group">
                                <label class="form-label">Experience (Years)</label>
                                <input type="number" min="0" id="cand-experience-years" class="form-control" value="${c ? c.experienceYears || 0 : 0}">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Available From</label>
                                <input type="date" id="cand-avail" class="form-control" value="${c && c.availableFrom ? new Date(c.availableFrom).toISOString().split('T')[0] : ''}">
                            </div>
                        </div>

                        <h3 style="border-bottom: 1px solid var(--border-color); padding-bottom: 5px; margin-bottom: 12px; color: var(--accent-primary); display: flex; align-items: center; justify-content: space-between;">
                            <span><i class="fas fa-ship"></i> Crewing Onboarding & Expiration Schedule</span>
                            <span style="font-size:0.75rem; font-weight:400; color:var(--text-muted);"><i class="fas fa-stopwatch"></i> Live Tracker</span>
                        </h3>
                        <div class="form-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
                            <div class="form-group">
                                <label class="form-label" style="display:flex; align-items:center; gap:6px;">
                                    <i class="fas fa-plane-arrival" style="color: #0ea5e9;"></i> Crew Onboarding Date & Time
                                </label>
                                <input type="datetime-local" id="cand-onboarding-datetime" class="form-control" value="${c && c.onboardingDateTime ? toDateTimeLocalInput(c.onboardingDateTime) : ''}">
                                <small style="font-size:0.72rem; color:var(--text-muted); display:block; margin-top:3px;">Joining / boarding date & time</small>
                            </div>
                            <div class="form-group">
                                <label class="form-label" style="display:flex; align-items:center; gap:6px;">
                                    <i class="fas fa-plane-departure" style="color: #f59e0b;"></i> Leaving Ship / Expiry Date & Time
                                </label>
                                <input type="datetime-local" id="cand-signoff-datetime" class="form-control" value="${c && c.signOffDateTime ? toDateTimeLocalInput(c.signOffDateTime) : ''}">
                                <small style="font-size:0.72rem; color:var(--text-muted); display:block; margin-top:3px;">Sign-off & contract expiration</small>
                            </div>
                        </div>

                    const updateLiveClock = () => {
                        const now = new Date().getTime();
                        const badgeEl = modal.querySelector('#tracker-status-badge');
                        const dEl = modal.querySelector('#cnt-days');
                        const hEl = modal.querySelector('#cnt-hours');
                        const mEl = modal.querySelector('#cnt-mins');
                        const sEl = modal.querySelector('#cnt-secs');
                        const msgEl = modal.querySelector('#tracker-message');
                        const progWrap = modal.querySelector('#tracker-progress-wrapper');
                        const progBar = modal.querySelector('#tracker-progress-bar');
                        const progText = modal.querySelector('#tracker-progress-text');

                        if (!dEl || !hEl || !mEl || !sEl) return;

                        const onMs = onDate ? onDate.getTime() : null;
                        const offMs = offDate ? offDate.getTime() : null;

                        if (!offMs && !onMs) {
                            if (badgeEl) badgeEl.innerHTML = `<span class="badge" style="background:rgba(100,116,139,0.15); color:var(--text-muted); font-size:0.85rem; padding:6px 14px;"><i class="fas fa-info-circle"></i> No Onboarding or Sign-Off Dates Configured</span>`;
                            if (msgEl) msgEl.innerHTML = `Click <strong>Edit Schedule</strong> to set the onboarding and leaving dates for this seafarer.`;
                            dEl.textContent = '--';
                            hEl.textContent = '--';
                            mEl.textContent = '--';
                            sEl.textContent = '--';
                            return;
                        }

                        if (offMs && now > offMs) {
                            // Contract Expired / Left ship
                            const elapsedMs = now - offMs;
                            const d = Math.floor(elapsedMs / (1000 * 60 * 60 * 24));
                            const h = Math.floor((elapsedMs % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                            const m = Math.floor((elapsedMs % (1000 * 60 * 60)) / (1000 * 60));
                            const s = Math.floor((elapsedMs % (1000 * 60)) / 1000);

                            if (badgeEl) badgeEl.innerHTML = `<span class="badge" style="background:rgba(239,68,68,0.15); color:#ef4444; border:1px solid rgba(239,68,68,0.3); font-size:0.85rem; padding:6px 14px;"><i class="fas fa-exclamation-triangle"></i> CONTRACT EXPIRED / DEPARTED SHIP</span>`;
                            dEl.style.color = '#ef4444';
                            hEl.style.color = '#ef4444';
                            mEl.style.color = '#ef4444';
                            sEl.style.color = '#ef4444';
                            dEl.textContent = String(d).padStart(2, '0');
                            hEl.textContent = String(h).padStart(2, '0');
                            mEl.textContent = String(m).padStart(2, '0');
                            sEl.textContent = String(s).padStart(2, '0');
                            if (msgEl) msgEl.innerHTML = `Contract reached end of tenure on <strong>${formatDateTime(offDate)}</strong> (${d}d ${h}h ${m}m ago).`;

                            if (progWrap) {
                                progWrap.style.display = 'block';
                                progBar.style.width = '100%';
                                progBar.style.background = '#ef4444';
                                progText.textContent = '100% (Completed)';
                                progText.style.color = '#ef4444';
                            }
                        } else if (offMs && (!onMs || now >= onMs)) {
                            // Currently Onboard sailing towards Sign-Off Date
                            const remainingMs = offMs - now;
                            const d = Math.floor(remainingMs / (1000 * 60 * 60 * 24));
                            const h = Math.floor((remainingMs % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                            const m = Math.floor((remainingMs % (1000 * 60 * 60)) / (1000 * 60));
                            const s = Math.floor((remainingMs % (1000 * 60)) / 1000);

                            const isWarning = d < 14;
                            const color = isWarning ? '#eab308' : '#10b981';
                            const badgeBg = isWarning ? 'rgba(234,179,8,0.15)' : 'rgba(16,185,129,0.15)';
                            const badgeBorder = isWarning ? 'rgba(234,179,8,0.3)' : 'rgba(16,185,129,0.3)';

                            if (badgeEl) badgeEl.innerHTML = `<span class="badge" style="background:${badgeBg}; color:${color}; border:1px solid ${badgeBorder}; font-size:0.85rem; padding:6px 14px;"><i class="fas fa-ship"></i> ${isWarning ? 'LEAVING SHIP SOON' : 'ONBOARD & ACTIVELY SAILING'}</span>`;

                            dEl.style.color = color;
                            hEl.style.color = color;
                            mEl.style.color = color;
                            sEl.style.color = color;
                            dEl.textContent = String(d).padStart(2, '0');
                            hEl.textContent = String(h).padStart(2, '0');
                            mEl.textContent = String(m).padStart(2, '0');
                            sEl.textContent = String(s).padStart(2, '0');

                            if (msgEl) msgEl.innerHTML = `Crew member is scheduled to leave the ship on <strong>${formatDateTime(offDate)}</strong>.`;

                            if (onMs && progWrap) {
                                progWrap.style.display = 'block';
                                const totalDuration = offMs - onMs;
                                const elapsed = now - onMs;
                                const pct = Math.min(Math.max(Math.round((elapsed / totalDuration) * 100), 0), 100);
                                progBar.style.width = `${pct}%`;
                                progBar.style.background = isWarning ? 'linear-gradient(90deg, #eab308, #ef4444)' : 'linear-gradient(90deg, #0ea5e9, #10b981)';
                                progText.textContent = `${pct}% Elapsed`;
                                progText.style.color = color;
                            }
                        } else if (onMs && now < onMs) {
                            // Upcoming Onboarding
                            const untilBoarding = onMs - now;
                            const d = Math.floor(untilBoarding / (1000 * 60 * 60 * 24));
                            const h = Math.floor((untilBoarding % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                            const m = Math.floor((untilBoarding % (1000 * 60 * 60)) / (1000 * 60));
                            const s = Math.floor((untilBoarding % (1000 * 60)) / 1000);

                            if (badgeEl) badgeEl.innerHTML = `<span class="badge" style="background:rgba(14,165,233,0.15); color:#0ea5e9; border:1px solid rgba(14,165,233,0.3); font-size:0.85rem; padding:6px 14px;"><i class="fas fa-calendar-check"></i> SCHEDULED FOR ONBOARDING</span>`;

                            dEl.style.color = '#0ea5e9';
                            hEl.style.color = '#0ea5e9';
                            mEl.style.color = '#0ea5e9';
                            sEl.style.color = '#0ea5e9';
                            dEl.textContent = String(d).padStart(2, '0');
                            hEl.textContent = String(h).padStart(2, '0');
                            mEl.textContent = String(m).padStart(2, '0');
                            sEl.textContent = String(s).padStart(2, '0');

                            if (msgEl) msgEl.innerHTML = `Crew member joins vessel on <strong>${formatDateTime(onDate)}</strong>.`;
                            if (progWrap) progWrap.style.display = 'none';
                        }
                    };

                    updateLiveClock();
                    _liveTrackerInterval = setInterval(updateLiveClock, 1000);
                }
            };

            window.deleteCandidate = async (id) => {
                if (window.UI?.confirm) {
                    const confirmed = await window.UI.confirm('Are you sure you want to delete this seafarer profile?');
                    if (confirmed) {
                        try {
                            await window.ApiService.crewing.candidates.delete(id);
                            window.UI.showToast('Seafarer profile deleted', 'success');
                            fetchData();
                        } catch (err) {
                            window.UI.showToast('Error deleting candidate', 'error');
                        }
                    }
                }
            };

            const exportBtn = document.getElementById('export-candidates-btn');
            if (exportBtn) {
                exportBtn.addEventListener('click', async () => {
                    const originalHtml = exportBtn.innerHTML;
                    exportBtn.disabled = true;
                    exportBtn.innerHTML = `<i class="fas fa-spinner fa-spin" style="color: #107c41;"></i> Exporting...`;

                    try {
                        // Always fetch the freshest dataset from server without disrupting current UI state
                        const res = await window.ApiService.crewing.candidates.getAll();
                        const dataToExport = (res && res.data && res.data.length > 0) ? res.data : candidatesData;

                        if (!dataToExport || dataToExport.length === 0) {
                            if (window.UI?.showToast) window.UI.showToast('No seafarers data available to export.', 'warning');
                            return;
                        }

                        if (typeof XLSX === 'undefined') {
                            throw new Error('Excel export library is loading. Please try again in a moment.');
                        }

                        const now = new Date().getTime();
                        const rows = dataToExport.map((c, index) => {
                            const seafarerId = c.seafarerId || c.applicationId || (c.id ? c.id.slice(-5).toUpperCase() : '');
                            let addedByName = '—';
                            let addedByRole = '—';
                            if (c.createdById) {
                                if (typeof c.createdById === 'object') {
                                    addedByName = c.createdById.name || c.createdById.email || '—';
                                    addedByRole = c.createdById.role || '—';
                                } else {
                                    addedByName = c.createdById;
                                }
                            }

                            const formatAvail = c.availableFrom ? new Date(c.availableFrom).toISOString().split('T')[0] : '—';
                            const onDateStr = c.onboardingDateTime ? new Date(c.onboardingDateTime).toLocaleString() : '—';
                            const offDateStr = c.signOffDateTime ? new Date(c.signOffDateTime).toLocaleString() : '—';
                            const passportExp = c.passportExpiryDate ? new Date(c.passportExpiryDate).toISOString().split('T')[0] : '—';
                            const cdcExp = c.cdcExpiryDate ? new Date(c.cdcExpiryDate).toISOString().split('T')[0] : '—';
                            const createdDate = c.createdAt ? new Date(c.createdAt).toISOString().split('T')[0] : '—';

                            let contractStatus = 'NOT SCHEDULED';
                            if (c.signOffDateTime) {
                                const offMs = new Date(c.signOffDateTime).getTime();
                                const onMs = c.onboardingDateTime ? new Date(c.onboardingDateTime).getTime() : null;
                                if (now > offMs) {
                                    contractStatus = 'EXPIRED / SIGNED OFF';
                                } else if (!onMs || now >= onMs) {
                                    contractStatus = 'ONBOARD (ACTIVE)';
                                } else {
                                    contractStatus = 'UPCOMING (SCHEDULED)';
                                }
                            }

                            return {
                                'S.No': index + 1,
                                'Seafarer ID': seafarerId,
                                'Application ID': c.applicationId || '—',
                                'Full Name': c.name || '—',
                                'Rank': c.rank || '—',
                                'Vessel Type': c.vesselType || '—',
                                'Current Vessel': c.currentVessel || '—',
                                'Status': c.status || 'AVAILABLE',
                                'Workflow Stage': c.workflowStage || 'SOURCING',
                                'Department': c.currentDepartment || c.department || 'SOURCING',
                                'Nationality': c.nationality || '—',
                                'Phone Number': c.phone || '—',
                                'Email Address': c.email || '—',
                                'COC Number': c.cocNumber || '—',
                                'Passport Number': c.passportNumber || '—',
                                'Passport Expiry': passportExp,
                                'CDC Number': c.cdcNumber || '—',
                                'CDC Expiry': cdcExp,
                                'Sea Experience (Years)': c.experienceYears ?? 0,
                                'Availability Date': formatAvail,
                                'Crew Onboarding Date & Time': onDateStr,
                                'Leaving Ship / Expiry Date & Time': offDateStr,
                                'Contract Expiry Status': contractStatus,
                                'Expected Salary (USD)': c.expectedSalary ? `$${c.expectedSalary}/m` : '$0/m',
                                'Currency': c.currency || 'USD',
                                'Added By': addedByName,
                                'Added By Role': addedByRole,
                                'Documentation Cleared': c.documentationCleared ? 'YES' : 'NO',
                                'Notes': c.notes || '—',
                                'Created Date': createdDate
                            };
                        });

                        const ws = XLSX.utils.json_to_sheet(rows);

                        // Auto-calculate column widths
                        const colWidths = Object.keys(rows[0] || {}).map(key => {
                            const maxLen = Math.max(
                                key.length,
                                ...rows.map(r => String(r[key] || '').length)
                            );
                            return { wch: Math.min(Math.max(maxLen + 3, 10), 40) };
                        });
                        ws['!cols'] = colWidths;

                        const wb = XLSX.utils.book_new();
                        XLSX.utils.book_append_sheet(wb, ws, 'Seafarers Directory');

                        const today = new Date().toISOString().split('T')[0];
                        XLSX.writeFile(wb, `Seafarers_Directory_${today}.xlsx`);

                        if (window.UI?.showToast) {
                            window.UI.showToast(`Exported ${rows.length} seafarers to Excel successfully`, 'success');
                        }
                    } catch (err) {
                        console.error('Error exporting seafarers to Excel:', err);
                        if (window.UI?.showToast) {
                            window.UI.showToast(err.message || 'Failed to export seafarers to Excel.', 'error');
                        }
                    } finally {
                        exportBtn.disabled = false;
                        exportBtn.innerHTML = originalHtml;
                    }
                });
            }

            fetchData();
        });
    </script>
    <script src="/public/js/components/ocean-bg.js"></script>
    <script src="/public/js/components/cursor.js"></script>
</body>

</html>
