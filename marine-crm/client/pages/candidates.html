<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seafarers Directory - Marine CRM</title>
    <link rel="stylesheet" href="/public/css/styles1.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>

<body>
    <div class="app-wrapper">
        <div id="sidebar-container"></div>
        <div id="sidebar-overlay" class="sidebar-overlay"></div>
        <div class="main-content">
            <div id="navbar-container"></div>
            <main class="page-content">
                <div class="page-header">
                    <div>
                        <h1 class="page-title">👨‍✈️ Seafarers Directory</h1>
                        <p class="page-subtitle">Manage qualified seafarer candidate database</p>
                    </div>
                    <button id="add-candidate-btn" class="btn btn-primary">
                        <i class="fas fa-plus"></i> Add Seafarer
                    </button>
                </div>

                <div class="filter-bar">
                    <div class="filter-group">

                        <input type="text" id="search-input" class="form-control"
                            placeholder="Search by name, location or email...">
                    </div>
                    <div class="filter-group">
                        <select id="rank-filter" class="form-control">
                            <option value="">All Ranks</option>
                            <optgroup label="Deck Side">
                                <option value="Master">Master</option>
                                <option value="Chief Officer">Chief Officer</option>
                                <option value="2nd Officer">2nd Officer</option>
                                <option value="3rd Officer">3rd Officer</option>
                                <option value="Junior Officer">Junior Officer</option>
                                <option value="Bosun">Bosun</option>
                                <option value="AB">AB</option>
                                <option value="OS">OS</option>
                            </optgroup>
                            <optgroup label="Engine Side">
                                <option value="Chief Engineer">Chief Engineer</option>
                                <option value="2E">Chief Mate / 2nd Engineer</option>
                                <option value="3E">3rd Engineer</option>
                                <option value="4E">4th Engineer</option>
                                <option value="ETO">Electro-Technical Officer</option>
                                <option value="Fitter">Fitter</option>
                                <option value="Oiler">Oiler</option>
                                <option value="Wiper">Wiper</option>
                            </optgroup>
                            <optgroup label="Galley">
                                <option value="Cook">Cook</option>
                                <option value="Messman">Messman</option>
                            </optgroup>
                        </select>
                    </div>
                    <div class="filter-group">
                        <select id="status-filter" class="form-control">
                            <option value="">All Statuses</option>
                            <option value="AVAILABLE">AVAILABLE</option>
                            <option value="SHORTLISTED">SHORTLISTED</option>
                            <option value="PROPOSED">PROPOSED</option>
                            <option value="APPROVED">APPROVED</option>
                            <option value="DOCUMENTATION">DOCUMENTATION</option>
                            <option value="ONBOARDED">ONBOARDED</option>
                            <option value="REJECTED_TALENT_POOL">TALENT POOL</option>
                        </select>
                    </div>
                </div>

                <div class="card">
                    <div class="card-body">
                        <div class="table-container">
                            <table id="candidates-table" class="table">
                                <thead>
                                    <tr>
                                        <th>Name</th>
                                        <th>Rank</th>
                                        <th>Location / Contact</th>
                                        <th>COC Info</th>
                                        <th>Availability</th>
                                        <th>Status</th>
                                        <th>Wages</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="candidates-tbody">
                                    <!-- Skeleton loader initially -->
                                    <tr class="skeleton-row">
                                        <td>
                                            <div class="skeleton-box"></div>
                                        </td>
                                        <td>
                                            <div class="skeleton-box"></div>
                                        </td>
                                        <td>
                                            <div class="skeleton-box"></div>
                                        </td>
                                        <td>
                                            <div class="skeleton-box"></div>
                                        </td>
                                        <td>
                                            <div class="skeleton-box"></div>
                                        </td>
                                        <td>
                                            <div class="skeleton-box"></div>
                                        </td>
                                        <td>
                                            <div class="skeleton-box"></div>
                                        </td>
                                        <td>
                                            <div class="skeleton-box"></div>
                                        </td>
                                    </tr>
                                    <tr class="skeleton-row">
                                        <td>
                                            <div class="skeleton-box"></div>
                                        </td>
                                        <td>
                                            <div class="skeleton-box"></div>
                                        </td>
                                        <td>
                                            <div class="skeleton-box"></div>
                                        </td>
                                        <td>
                                            <div class="skeleton-box"></div>
                                        </td>
                                        <td>
                                            <div class="skeleton-box"></div>
                                        </td>
                                        <td>
                                            <div class="skeleton-box"></div>
                                        </td>
                                        <td>
                                            <div class="skeleton-box"></div>
                                        </td>
                                        <td>
                                            <div class="skeleton-box"></div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <div id="empty-state" class="empty-state" style="display: none;">
                            <i class="fas fa-user-slash fa-3x"></i>
                            <p>No seafarers found matching your criteria.</p>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/public/js/api/api.js"></script>
    <script src="/public/js/components/ui.js"></script>
    <script src="/public/js/components/sidebar.js"></script>
    <script src="/public/js/components/birthday.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let candidatesData = [];
            let currentEditId = null;
            let _candidateModal = null;
            let expCount = 0;

            const tbody = document.getElementById('candidates-tbody');
            const _loggedInUserRole = (JSON.parse(localStorage.getItem('user') || '{}').role) || '';
            const searchInput = document.getElementById('search-input');
            const rankFilter = document.getElementById('rank-filter');
            const statusFilter = document.getElementById('status-filter');
            const emptyState = document.getElementById('empty-state');

            async function fetchData() {
                try {
                    const res = await window.ApiService.crewing.candidates.getAll();
                    candidatesData = res.data || [];
                    renderTable();
                } catch (error) {
                    console.error('Error fetching candidates:', error);
                    if (window.UI?.showToast) window.UI.showToast('Failed to load seafarers', 'error');
                }
            }

            function renderTable() {
                const search = searchInput.value.toLowerCase();
                const rank = rankFilter.value;
                const status = statusFilter.value;

                const filtered = candidatesData.filter(c => {
                    const matchSearch = (c.name || '').toLowerCase().includes(search) ||
                        (c.nationality || '').toLowerCase().includes(search) ||
                        (c.currentVessel || '').toLowerCase().includes(search) ||
                        (c.email || '').toLowerCase().includes(search);
                    const matchRank = rank ? c.rank === rank : true;
                    const matchStatus = status ? c.status === status : true;
                    return matchSearch && matchRank && matchStatus;
                });

                tbody.innerHTML = '';
                if (filtered.length === 0) {
                    emptyState.style.display = 'block';
                    document.getElementById('candidates-table').style.display = 'none';
                } else {
                    emptyState.style.display = 'none';
                    document.getElementById('candidates-table').style.display = 'table';
                    filtered.forEach(c => {
                        const tr = document.createElement('tr');
                        const formatAvail = c.availableFrom ? new Date(c.availableFrom).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '—';
                        const canSeeDocs = ['ADMIN', 'DIRECTOR', 'COO', 'DOCUMENTATION_MANAGER', 'DOCUMENTATION_OFFICER'].includes(_loggedInUserRole);
                        tr.innerHTML = `
                            <td><strong>${c.name}</strong></td>
                            <td><span class="badge badge-blue">${c.rank}</span></td>
                            <td>
                                <div><i class="fas fa-flag"></i> ${c.nationality || '—'}</div>
                                <div style="font-size: 0.8rem; color: var(--text-secondary);"><i class="fas fa-envelope"></i> ${c.email || '—'}</div>
                                <div style="font-size: 0.8rem; color: var(--text-secondary);"><i class="fas fa-phone"></i> ${c.phone || '—'}</div>
                            </td>
                            <td>
                                <div><strong>Passport:</strong> ${c.passportNumber || '—'}</div>
                                <div style="font-size: 0.8rem; color: var(--text-secondary);">CDC: ${c.cdcNumber || '—'}</div>
                            </td>
                            <td>${formatAvail}</td>
                            <td>
                                ${window.UI?.renderStatusBadge ? window.UI.renderStatusBadge(c.status) : `<span class="badge">${c.status}</span>`}
                            </td>
                            <td>
                                <div style="font-size: 0.85rem;">Exp: ${c.experienceYears || 0} yrs</div>
                                <div style="font-weight: 600; color: var(--accent-primary);">Exp Salary: $${c.expectedSalary || 0}/m</div>
                            </td>
                            <td class="row-actions">
                                <button class="btn btn-secondary btn-sm" onclick="editCandidate('${c.id}')" title="Edit Profile"><i class="fas fa-user-edit"></i></button>
                                ${canSeeDocs ? `<a class="btn btn-secondary btn-sm" href="/pages/documents.html?candidateId=${c.id}&name=${encodeURIComponent(c.name || '')}" title="View Documents"><i class="fas fa-folder-open"></i></a>` : ''}
                                <button class="btn btn-danger btn-sm" onclick="deleteCandidate('${c.id}')" title="Delete Profile"><i class="fas fa-trash"></i></button>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
            }

            searchInput.addEventListener('input', renderTable);
            rankFilter.addEventListener('change', renderTable);
            statusFilter.addEventListener('change', renderTable);

            document.getElementById('add-candidate-btn').addEventListener('click', () => {
                currentEditId = null;
                openCandidateModal();
            });

            window.editCandidate = (id) => {
                currentEditId = id;
                const candidate = candidatesData.find(c => c.id === id);
                if (candidate) openCandidateModal(candidate);
            };

            function openCandidateModal(c = null) {
                const title = c ? 'Edit Seafarer Profile' : 'Register New Seafarer';
                expCount = 0;

                const rankOptions = [
                    'Master', 'Chief Officer', '2nd Officer', '3rd Officer', 'Junior Officer', 'Bosun', 'AB', 'OS',
                    'Chief Engineer', '2E', '3E', '4E', 'ETO', 'Fitter', 'Oiler', 'Wiper',
                    'Cook', 'Messman'
                ].map(r => `<option value="${r}" ${c && c.rank === r ? 'selected' : ''}>${r}</option>`).join('');

                const bodyHtml = `
                    <form id="candidate-form" style="max-height: 70vh; overflow-y: auto; padding-right: 8px;">
                        <h3 style="border-bottom: 1px solid var(--border-color); padding-bottom: 5px; margin-bottom: 12px; color: var(--accent-primary);">General Info</h3>
                        <div class="form-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
                            <div class="form-group">
                                <label class="form-label">Full Name *</label>
                                <input type="text" id="cand-name" class="form-control" value="${c ? c.name : ''}" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Rank *</label>
                                <select id="cand-rank" class="form-control" required>
                                    <option value="">Select Rank</option>
                                    ${rankOptions}
                                </select>
                            </div>
                        </div>

                        <div class="form-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
                            <div class="form-group">
                                <label class="form-label">Nationality</label>
                                <input type="text" id="cand-nationality" class="form-control" value="${c ? c.nationality || '' : ''}" placeholder="e.g. Ukraine">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Current Vessel</label>
                                <input type="text" id="cand-vessel" class="form-control" value="${c ? c.currentVessel || '' : ''}" placeholder="e.g. MV Ocean Star">
                            </div>
                        </div>

                        <div class="form-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
                            <div class="form-group">
                                <label class="form-label">Phone</label>
                                <input type="tel" id="cand-phone" class="form-control" value="${c ? c.phone || '' : ''}" placeholder="+380...">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Email Address</label>
                                <input type="email" id="cand-email" class="form-control" value="${c ? c.email || '' : ''}">
                            </div>
                        </div>

                        <h3 style="border-bottom: 1px solid var(--border-color); padding-bottom: 5px; margin-bottom: 12px; color: var(--accent-primary);">Certificates</h3>
                        <div class="form-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
                            <div class="form-group">
                                <label class="form-label">Passport Number</label>
                                <input type="text" id="cand-passport-no" class="form-control" value="${c ? c.passportNumber || '' : ''}">
                            </div>
                            <div class="form-group">
                                <label class="form-label">CDC Number</label>
                                <input type="text" id="cand-cdc-no" class="form-control" value="${c ? c.cdcNumber || '' : ''}">
                            </div>
                        </div>

                        <h3 style="border-bottom: 1px solid var(--border-color); padding-bottom: 5px; margin-bottom: 12px; color: var(--accent-primary);">Experience & Availability</h3>
                        <div class="form-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
                            <div class="form-group">
                                <label class="form-label">Experience (Years)</label>
                                <input type="number" min="0" id="cand-experience-years" class="form-control" value="${c ? c.experienceYears || 0 : 0}">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Available From</label>
                                <input type="date" id="cand-avail" class="form-control" value="${c && c.availableFrom ? new Date(c.availableFrom).toISOString().split('T')[0] : ''}">
                            </div>
                        </div>

                        <div class="form-row" style="display: grid; grid-template-columns: 2fr 1fr; gap: 15px; margin-bottom: 15px;">
                            <div class="form-group">
                                <label class="form-label">Expected Salary (per month)</label>
                                <input type="number" id="cand-expected-salary" class="form-control" value="${c ? c.expectedSalary || '' : ''}">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Currency</label>
                                <select id="cand-currency" class="form-control">
                                    ${['USD', 'EUR', 'GBP'].map(cur => `<option value="${cur}" ${c && c.currency === cur ? 'selected' : (!c && cur === 'USD' ? 'selected' : '')}>${cur}</option>`).join('')}
                                </select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Notes</label>
                            <textarea id="cand-notes" class="form-control" rows="2">${c ? c.notes || '' : ''}</textarea>
                        </div>
                    </form>
                `;

                const footerHtml = `
                    <button class="btn btn-secondary" type="button" id="cancel-candidate-btn">Cancel</button>
                    <button class="btn btn-primary"   type="button" id="save-candidate-btn">Save Seafarer</button>
                `;

                if (window.UI?.createModal) {
                    _candidateModal = window.UI.createModal({
                        title,
                        bodyHtml,
                        footerHtml,
                        onClose: () => { _candidateModal = null; }
                    });

                    _candidateModal.querySelector('#cancel-candidate-btn').addEventListener('click', () => {
                        if (_candidateModal) _candidateModal.close();
                    });

                    _candidateModal.querySelector('#save-candidate-btn').addEventListener('click', saveCandidate);
                }
            }

            window.saveCandidate = async () => {
                const name = document.getElementById('cand-name').value.trim();
                const rank = document.getElementById('cand-rank').value;

                if (!name || !rank) {
                    if (window.UI?.showToast) window.UI.showToast('Name and Rank are required', 'error');
                    return;
                }

                const experienceYears = document.getElementById('cand-experience-years').value;
                const expectedSalary = document.getElementById('cand-expected-salary').value;
                const avail = document.getElementById('cand-avail').value;

                const payload = {
                    name,
                    rank,
                    nationality: document.getElementById('cand-nationality').value.trim() || null,
                    currentVessel: document.getElementById('cand-vessel').value.trim() || null,
                    phone: document.getElementById('cand-phone').value.trim() || null,
                    email: document.getElementById('cand-email').value.trim() || null,
                    passportNumber: document.getElementById('cand-passport-no').value.trim() || null,
                    cdcNumber: document.getElementById('cand-cdc-no').value.trim() || null,
                    experienceYears: experienceYears ? parseInt(experienceYears, 10) : 0,
                    availableFrom: avail || null,
                    expectedSalary: expectedSalary ? parseFloat(expectedSalary) : null,
                    currency: document.getElementById('cand-currency').value,
                    notes: document.getElementById('cand-notes').value.trim() || null,
                };

                try {
                    if (currentEditId) {
                        await window.ApiService.crewing.candidates.update(currentEditId, payload);
                        if (window.UI?.showToast) window.UI.showToast('✅ Seafarer updated successfully', 'success');
                    } else {
                        await window.ApiService.crewing.candidates.create(payload);
                        if (window.UI?.showToast) window.UI.showToast('✅ Seafarer registered successfully', 'success');
                    }
                    if (_candidateModal) _candidateModal.close();
                    fetchData();
                } catch (error) {
                    console.error('Error saving seafarer:', error);
                    if (window.UI?.showToast) window.UI.showToast(error.message || 'Error saving candidate', 'error');
                }
            };

            window.deleteCandidate = async (id) => {
                if (window.UI?.confirm) {
                    const confirmed = await window.UI.confirm('Are you sure you want to delete this seafarer profile?');
                    if (confirmed) {
                        try {
                            await window.ApiService.crewing.candidates.delete(id);
                            window.UI.showToast('Seafarer profile deleted', 'success');
                            fetchData();
                        } catch (err) {
                            window.UI.showToast('Error deleting candidate', 'error');
                        }
                    }
                }
            };

            fetchData();
        });
    </script>
    <script src="/public/js/components/ocean-bg.js"></script>
    <script src="/public/js/components/cursor.js"></script>
</body>

</html>
